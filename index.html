<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Sales Tracker - David</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Gráficos Recharts -->
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        /* Animación para el cargando */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-[#f8fafc]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { PieChart, Pie, Cell, ResponsiveContainer, Tooltip } = Recharts;

        // URL DE TU GOOGLE SCRIPT (API)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwg5UFngW8Bf_eExyUhA1lq3BxUMlBVRZEvZanSbGXIyLEP3V8rKdFhlZxBDaVpN6wQ/exec"; 

        const App = () => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterEstado, setFilterEstado] = useState('Todos');
            const [filterConsultor, setFilterConsultor] = useState('Todos');

            // Carga inicial
            useEffect(() => {
                const init = async () => {
                    await fetchData();
                    if (window.lucide) window.lucide.createIcons();
                };
                init();
            }, []);

            // Actualizar iconos cada vez que cambie la data o filtros
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [data, searchTerm, filterEstado, filterConsultor]);

            const fetchData = async () => {
                if (!GOOGLE_SCRIPT_URL) {
                    // Datos de ejemplo por si no hay URL
                    setData([
                        { id: 'CO211493', nombre: 'A & P Ingeniería', valorMensual: 198031.51, recurrencia: 196070.8, cuentaViva: 1, propietario: 'Fabian Alberto Beltran', prioridad: false, actividad: '' },
                        { id: 'CO590524', nombre: 'Sergio Pérez VIP', valorMensual: 500000.00, recurrencia: 110000.0, cuentaViva: 1, propietario: 'Sandra Patricia Florez', prioridad: true, actividad: 'Llamada urgente' },
                        { id: 'CO211251', nombre: 'Seguros A.P.', valorMensual: 134198.68, recurrencia: 133400, cuentaViva: 2, propietario: 'Reinel Calvo', prioridad: false, actividad: '' }
                    ]);
                    setLoading(false);
                    return;
                }
                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL);
                    const json = await response.json();
                    setData(json);
                } catch (e) { 
                    console.error("Error cargando:", e);
                } finally { 
                    setLoading(false); 
                }
            };

            const saveToSheet = async (item) => {
                if (!GOOGLE_SCRIPT_URL) return;
                setSaving(true);
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(item)
                    });
                } catch (e) { console.error(e); }
                finally { setSaving(false); }
            };

            const updateItem = (id, fields) => {
                const newData = data.map(item => {
                    if (item.id === id) {
                        const updated = { ...item, ...fields };
                        saveToSheet(updated);
                        return updated;
                    }
                    return item;
                });
                setData(newData);
            };

            const VIP_THRESHOLD = 200000;
            const statusConfig = {
                1: { text: 'Vivo', color: 'bg-emerald-100 text-emerald-700', icon: 'activity' },
                2: { text: 'Pausado', color: 'bg-amber-100 text-amber-700', icon: 'clock' },
                0: { text: 'Cerrado', color: 'bg-slate-100 text-slate-500', icon: 'check-circle' }
            };

            const consultores = useMemo(() => ['Todos', ...new Set(data.map(item => item.propietario))], [data]);
            
            const filteredData = useMemo(() => {
                return data.filter(item => {
                    const matchesSearch = item.nombre.toLowerCase().includes(searchTerm.toLowerCase());
                    const label = statusConfig[item.cuentaViva]?.text || '';
                    const matchesEstado = filterEstado === 'Todos' || label === filterEstado;
                    const matchesConsultor = filterConsultor === 'Todos' || item.propietario === filterConsultor;
                    return matchesSearch && matchesEstado && matchesConsultor;
                });
            }, [data, searchTerm, filterEstado, filterConsultor]);

            const planDelDia = useMemo(() => {
                return filteredData.filter(d => 
                    d.prioridad || 
                    (d.cuentaViva === 1 && d.recurrencia === 0) || 
                    (d.valorMensual >= VIP_THRESHOLD && d.cuentaViva !== 0)
                );
            }, [filteredData]);

            if (loading) return (
                <div className="min-h-screen flex flex-col items-center justify-center">
                    <div className="spinner mb-4"></div>
                    <p className="font-bold text-slate-500">Iniciando CRM de David...</p>
                </div>
            );

            return (
                <div className="p-4 md:p-8 max-w-7xl mx-auto">
                    {saving && (
                        <div className="fixed top-4 right-4 bg-white shadow-2xl border border-blue-100 px-6 py-3 rounded-full flex items-center gap-3 z-50">
                            <i data-lucide="save" className="w-4 h-4 text-blue-500 animate-bounce"></i>
                            <span className="text-[10px] font-black uppercase text-slate-600">Sincronizando Excel...</span>
                        </div>
                    )}

                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
                        <div>
                            <h1 className="text-3xl font-extrabold text-slate-800 tracking-tight flex items-center gap-3">
                                <i data-lucide="layout-dashboard" className="text-blue-500"></i>
                                CRM Hub Cloud
                            </h1>
                            <p className="text-slate-400 font-medium">David • Gestión de Clientes VIP</p>
                        </div>
                        <div className="flex gap-2">
                            <div className="bg-white p-2 rounded-xl shadow-sm border border-slate-100 flex items-center px-3">
                                <i data-lucide="users" className="w-3 h-3 text-slate-400 mr-2"></i>
                                <select value={filterConsultor} onChange={(e)=>setFilterConsultor(e.target.value)} className="bg-transparent text-[11px] font-bold outline-none">
                                    {consultores.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <div className="bg-white p-2 rounded-xl shadow-sm border border-slate-100 flex items-center px-3">
                                <i data-lucide="filter" className="w-3 h-3 text-slate-400 mr-2"></i>
                                <select value={filterEstado} onChange={(e)=>setFilterEstado(e.target.value)} className="bg-transparent text-[11px] font-bold outline-none">
                                    <option value="Todos">Todos</option>
                                    <option value="Vivo">Vivos</option>
                                    <option value="Pausado">Pausados</option>
                                    <option value="Cerrado">Cerrados</option>
                                </select>
                            </div>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-2 space-y-4">
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-3">
                                <i data-lucide="search" className="w-4 h-4 text-slate-300"></i>
                                <input 
                                    type="text" 
                                    placeholder="Buscar por nombre de cliente..." 
                                    className="w-full bg-transparent text-sm outline-none"
                                    value={searchTerm}
                                    onChange={(e)=>setSearchTerm(e.target.value)}
                                />
                            </div>

                            <div className="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-50/50 border-b border-slate-100">
                                        <tr>
                                            <th className="p-5 font-bold text-slate-400 uppercase text-[9px] w-16 text-center">Fijar</th>
                                            <th className="p-5 font-bold text-slate-400 uppercase text-[9px]">Cuenta / Análisis</th>
                                            <th className="p-5 font-bold text-slate-400 uppercase text-[9px] text-right">Monto K</th>
                                            <th className="p-5 font-bold text-slate-400 uppercase text-[9px] text-center">Estado</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredData.map(item => (
                                            <tr key={item.id} className="border-b border-slate-50 hover:bg-slate-50/50 transition-all">
                                                <td className="p-5 text-center">
                                                    <button onClick={() => updateItem(item.id, { prioridad: !item.prioridad })}>
                                                        <i data-lucide="star" className={`w-5 h-5 ${item.prioridad ? 'fill-amber-400 text-amber-400' : 'text-slate-200'}`}></i>
                                                    </button>
                                                </td>
                                                <td className="p-5">
                                                    <div className="font-bold text-slate-800 flex items-center gap-2">
                                                        {item.nombre}
                                                        {item.valorMensual >= VIP_THRESHOLD && <i data-lucide="gem" className="w-3 h-3 text-indigo-500"></i>}
                                                    </div>
                                                    <input 
                                                        type="text" 
                                                        defaultValue={item.actividad}
                                                        onBlur={(e) => updateItem(item.id, { actividad: e.target.value })}
                                                        className="block w-full text-[11px] text-blue-500 bg-transparent outline-none italic mt-1"
                                                        placeholder="Agregar nota de gestión..."
                                                    />
                                                </td>
                                                <td className="p-5 text-right font-bold text-slate-700">
                                                    <input 
                                                        type="number" 
                                                        defaultValue={item.recurrencia}
                                                        onBlur={(e) => updateItem(item.id, { recurrencia: parseFloat(e.target.value) })}
                                                        className="w-24 text-right bg-slate-50 rounded px-2 py-1 outline-none focus:ring-1 ring-blue-100"
                                                    />
                                                </td>
                                                <td className="p-5 text-center">
                                                    <button 
                                                        onClick={() => {
                                                            const next = item.cuentaViva === 1 ? 2 : item.cuentaViva === 2 ? 0 : 1;
                                                            updateItem(item.id, { cuentaViva: next });
                                                        }}
                                                        className={`w-28 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all ${statusConfig[item.cuentaViva].color}`}
                                                    >
                                                        {statusConfig[item.cuentaViva].text}
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="bg-slate-900 rounded-[3rem] p-8 text-white min-h-[500px] shadow-2xl">
                            <h3 className="text-xl font-bold mb-6 flex items-center gap-3">
                                <i data-lucide="zap" className="text-amber-400"></i>
                                Plan de Acción
                            </h3>
                            <div className="space-y-4 max-h-[600px] overflow-y-auto custom-scrollbar pr-2">
                                {planDelDia.length === 0 ? (
                                    <p className="text-slate-500 text-sm italic">No hay acciones urgentes pendientes.</p>
                                ) : (
                                    planDelDia.map(p => (
                                        <div key={p.id} className="p-5 rounded-[1.8rem] bg-white/5 border border-white/10 hover:border-blue-500/50 transition-all cursor-default">
                                            <div className="flex justify-between items-start mb-2">
                                                <p className="text-xs font-bold text-blue-300 truncate w-4/5">{p.nombre}</p>
                                                {p.valorMensual >= VIP_THRESHOLD && <i data-lucide="shield-check" className="w-3 h-3 text-indigo-400"></i>}
                                            </div>
                                            <p className="text-[10px] text-slate-400 leading-relaxed italic mb-4">
                                                {p.actividad || "🚨 Pendiente gestión estratégica"}
                                            </p>
                                            <div className="flex justify-between items-center text-[9px] font-black tracking-widest text-slate-500 uppercase">
                                                <span>{p.propietario.split(' ')[0]}</span>
                                                <span className="text-emerald-400 text-xs">${p.valorMensual.toLocaleString()}</span>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
