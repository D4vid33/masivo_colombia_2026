<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Strategy Hub - David</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        
        .row-critical { background-color: rgba(254, 226, 226, 0.4) !important; border-left: 4px solid #ef4444; }
        .row-alert { background-color: rgba(255, 251, 235, 0.5) !important; border-left: 4px solid #f59e0b; }
        .row-urgent { background-color: rgba(239, 246, 255, 0.6) !important; border-left: 4px solid #3b82f6; }
        
        .star-active { fill: #fbbf24 !important; stroke: #d97706 !important; transform: scale(1.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .animate-pulse-soft { animation: pulse-soft 3s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0WksJMnSOiUg683oUvM3sx5UkaprD938spVnRURmgnCLBPlJK6LMG5pOMwWeyel83/exec";

        const App = () => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterConsultor, setFilterConsultor] = useState('Todos');
            const [filterEstado, setFilterEstado] = useState('Todos');

            useEffect(() => { fetchData(); }, []);
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [data, loading, searchTerm, filterConsultor]);

            const fetchData = async () => {
                try {
                    setLoading(true);
                    const response = await fetch(GOOGLE_SCRIPT_URL);
                    const json = await response.json();
                    setData(json.map(item => ({
                        ...item,
                        prioridad: item.prioridad || false,
                        recurrencia: item.recurrencia || 0,
                        cuentaViva: item.cuentaViva || 0 // 1: Vivo, 2: Pausa, 0: Cerrado
                    })));
                } catch (e) { console.error(e); } finally { setLoading(false); }
            };

            const updateItem = async (updatedItem) => {
                setSaving(true);
                setData(prev => prev.map(d => d.id === updatedItem.id ? updatedItem : d));
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify(updatedItem)
                    });
                } finally { setTimeout(() => setSaving(false), 500); }
            };

            const getNivel = (item) => {
                if (item.cuentaViva === 1 && item.recurrencia === 0) return "Critico";
                if (item.cuentaViva === 1 && item.recurrencia < (item.valorMensual * 0.5)) return "Alerta";
                if (item.prioridad === true) return "Urgente";
                return "Normal";
            };

            const getEstadoTexto = (val) => {
                if (val === 1) return "Vivo";
                if (val === 2) return "Pausa";
                return "Cerrado";
            };

            const consultores = useMemo(() => ['Todos', ...new Set(data.map(d => d.propietario))], [data]);
            
            const metrics = useMemo(() => {
                const totalTarget = data.reduce((a, b) => a + b.valorMensual, 0);
                const totalReal = data.reduce((a, b) => a + b.recurrencia, 0);
                const criticos = data.filter(d => getNivel(d) === "Critico").length;
                return { totalTarget, totalReal, criticos };
            }, [data]);

            const filteredData = useMemo(() => {
                return data.filter(d => {
                    const matchSearch = d.nombre.toLowerCase().includes(searchTerm.toLowerCase()) || d.id.toString().includes(searchTerm);
                    const matchUser = filterConsultor === 'Todos' || d.propietario === filterConsultor;
                    const matchEstado = filterEstado === 'Todos' || getEstadoTexto(d.cuentaViva) === filterEstado;
                    return matchSearch && matchUser && matchEstado;
                });
            }, [data, searchTerm, filterConsultor, filterEstado]);

            const focoEstrategico = useMemo(() => data.filter(d => getNivel(d) !== "Normal"), [data]);

            if (loading) return <div className="min-h-screen flex items-center justify-center bg-white font-black text-[10px] tracking-[0.3em] uppercase italic">Sincronizando con David Elite...</div>;

            return (
                <div className="max-w-[1600px] mx-auto p-4 md:p-8">
                    {/* Header */}
                    <header className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 mb-10">
                        <div>
                            <h1 className="text-3xl font-extrabold tracking-tighter text-slate-900 flex items-center gap-3">
                                Retention Command Center <span className="text-blue-600 text-sm font-black bg-blue-50 px-3 py-1 rounded-full uppercase tracking-widest">David Elite</span>
                            </h1>
                            <p className="text-slate-400 text-[10px] font-bold uppercase tracking-widest mt-1">Gestión de Suscripciones y Estados</p>
                        </div>

                        <div className="flex flex-wrap gap-3 w-full lg:w-auto">
                            <div className="relative flex-1 lg:w-64">
                                <i data-lucide="search" className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300"></i>
                                <input 
                                    className="w-full pl-12 pr-4 py-4 bg-white border-none rounded-2xl text-xs shadow-sm focus:ring-2 focus:ring-blue-500 outline-none"
                                    placeholder="Buscar cliente..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)}
                                />
                            </div>
                            <select 
                                className="bg-white px-6 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest border-none shadow-sm outline-none cursor-pointer"
                                value={filterConsultor} onChange={e => setFilterConsultor(e.target.value)}
                            >
                                {consultores.map(c => <option key={c} value={c}>{c === 'Todos' ? 'Consultores' : c}</option>)}
                            </select>
                            <select 
                                className="bg-white px-6 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest border-none shadow-sm outline-none cursor-pointer"
                                value={filterEstado} onChange={e => setFilterEstado(e.target.value)}
                            >
                                <option value="Todos">Todos los Estados</option>
                                <option value="Vivo">Vivos</option>
                                <option value="Pausa">En Pausa</option>
                                <option value="Cerrado">Cerrados</option>
                            </select>
                            <button onClick={fetchData} className="p-4 bg-white rounded-2xl shadow-sm hover:text-blue-600 transition-colors">
                                <i data-lucide="refresh-cw" className={`w-5 h-5 ${saving ? 'animate-spin' : ''}`}></i>
                            </button>
                        </div>
                    </header>

                    {/* KPIs Rápidos */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                        <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                            <span className="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-2">Recaudación Real</span>
                            <p className="text-3xl font-black text-emerald-600">${metrics.totalReal.toLocaleString()}</p>
                        </div>
                        <div className="bg-rose-500 p-8 rounded-[2rem] shadow-xl shadow-rose-200 text-white relative overflow-hidden">
                            <div className="relative z-10">
                                <span className="text-[9px] font-black text-rose-100 uppercase tracking-widest">Cuentas Críticas</span>
                                <p className="text-4xl font-black mt-2">{metrics.criticos}</p>
                            </div>
                            <i data-lucide="alert-octagon" className="absolute -right-4 -bottom-4 w-24 h-24 text-white/10 rotate-12"></i>
                        </div>
                        <div className="bg-slate-900 p-8 rounded-[2rem] shadow-xl text-white">
                            <span className="text-[9px] font-black text-slate-500 uppercase tracking-widest block mb-2">Meta Mensual</span>
                            <p className="text-3xl font-black text-blue-400">${metrics.totalTarget.toLocaleString()}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 xl:grid-cols-4 gap-8">
                        {/* Monitor Principal */}
                        <div className="xl:col-span-3 bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                            <div className="p-8 border-b border-slate-50 bg-slate-50/30">
                                <h2 className="text-xs font-black text-slate-500 uppercase tracking-[0.2em]">Detalle de Cartera Directa</h2>
                            </div>
                            
                            <div className="overflow-x-auto">
                                <table className="w-full text-left">
                                    <thead>
                                        <tr className="bg-slate-50/50">
                                            <th className="p-6 text-[9px] font-black text-slate-400 uppercase text-center w-16">Prio</th>
                                            <th className="p-6 text-[9px] font-black text-slate-400 uppercase">Cliente / Propietario</th>
                                            <th className="p-6 text-[9px] font-black text-slate-400 uppercase text-right">Suscripción ($)</th>
                                            <th className="p-6 text-[9px] font-black text-slate-400 uppercase text-center w-40">Estado Cuenta</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-50">
                                        {filteredData.map(item => {
                                            const nivel = getNivel(item);
                                            const rowClass = nivel === "Critico" ? "row-critical" : nivel === "Alerta" ? "row-alert" : nivel === "Urgente" ? "row-urgent" : "";
                                            
                                            return (
                                                <tr key={item.id} className={`transition-all hover:bg-slate-50/80 ${rowClass}`}>
                                                    <td className="p-6 text-center">
                                                        <button onClick={() => updateItem({...item, prioridad: !item.prioridad})}>
                                                            <i data-lucide="star" className={`w-5 h-5 transition-all ${item.prioridad ? 'star-active' : 'text-slate-200 hover:text-slate-300'}`}></i>
                                                        </button>
                                                    </td>
                                                    <td className="p-6">
                                                        <div className="font-bold text-slate-800 text-sm tracking-tight mb-1">{item.nombre}</div>
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-[9px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded uppercase">{item.id}</span>
                                                            <span className="text-[9px] font-black text-blue-500 uppercase">{item.propietario}</span>
                                                        </div>
                                                    </td>
                                                    <td className="p-6 text-right">
                                                        <input 
                                                            type="number" 
                                                            className="w-32 bg-white/50 border border-slate-200 rounded-xl px-4 py-2 text-right font-black text-slate-700 text-xs focus:ring-2 focus:ring-blue-500 outline-none"
                                                            value={item.recurrencia}
                                                            onChange={e => updateItem({...item, recurrencia: parseFloat(e.target.value) || 0})}
                                                        />
                                                    </td>
                                                    <td className="p-6">
                                                        <button 
                                                            onClick={() => {
                                                                const next = item.cuentaViva === 1 ? 2 : item.cuentaViva === 2 ? 0 : 1;
                                                                updateItem({...item, cuentaViva: next});
                                                            }}
                                                            className={`w-full py-2.5 rounded-xl text-[9px] font-black uppercase tracking-widest border transition-all
                                                                ${item.cuentaViva === 1 ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 
                                                                  item.cuentaViva === 2 ? 'bg-amber-50 text-amber-600 border-amber-100' : 
                                                                  'bg-slate-50 text-slate-400 border-slate-200'}`}
                                                        >
                                                            {getEstadoTexto(item.cuentaViva)}
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Foco Estratégico Dinámico */}
                        <div className="xl:col-span-1">
                            <div className="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl sticky top-8">
                                <h3 className="text-lg font-black tracking-tight flex items-center gap-3 mb-8 text-blue-400">
                                    <i data-lucide="zap" className="animate-pulse"></i> Foco Directo
                                </h3>

                                <div className="space-y-4 max-h-[700px] overflow-y-auto pr-2 custom-scrollbar">
                                    {focoEstrategico.map(p => (
                                        <div key={p.id} className="p-5 rounded-2xl bg-white/5 border border-white/5 hover:bg-white/10 transition-all">
                                            <div className="flex justify-between items-start mb-4">
                                                <div>
                                                    <p className="text-[11px] font-black text-white uppercase mb-1 leading-tight">{p.nombre}</p>
                                                    <span className={`text-[8px] font-black px-2 py-0.5 rounded uppercase ${getNivel(p) === 'Critico' ? 'bg-rose-500' : 'bg-amber-500'}`}>
                                                        {getNivel(p)}
                                                    }</span>
                                                </div>
                                                <button onClick={() => updateItem({...p, prioridad: false})} className="text-slate-600 hover:text-white">
                                                    <i data-lucide="x-circle" className="w-4 h-4"></i>
                                                </button>
                                            </div>

                                            {/* Cambio de Estado Rápido en Foco */}
                                            <div className="grid grid-cols-3 gap-1 mb-4">
                                                {[1, 2, 0].map(val => (
                                                    <button 
                                                        key={val}
                                                        onClick={() => updateItem({...p, cuentaViva: val})}
                                                        className={`py-1.5 rounded-lg text-[8px] font-black uppercase border transition-all
                                                            ${p.cuentaViva === val ? 'bg-blue-600 border-blue-500 text-white' : 'bg-white/5 border-white/5 text-slate-500 hover:bg-white/10'}`}
                                                    >
                                                        {getEstadoTexto(val)}
                                                    </button>
                                                ))}
                                            </div>

                                            <textarea 
                                                className="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-[10px] text-slate-300 outline-none focus:border-blue-500/50 transition-all resize-none"
                                                placeholder="Siguiente paso..."
                                                rows="2"
                                                onBlur={e => updateItem({...p, actividad: e.target.value})}
                                                defaultValue={p.actividad}
                                            ></textarea>
                                        </div>
                                    ))}
                                    {focoEstrategico.length === 0 && (
                                        <div className="text-center py-20 opacity-30">
                                            <i data-lucide="check-circle" className="w-12 h-12 mx-auto mb-4"></i>
                                            <p className="text-[10px] font-black uppercase tracking-widest">Sin alertas críticas</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
