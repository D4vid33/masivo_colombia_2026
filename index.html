<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Sales Tracker - David</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
            margin: 0; 
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Ajuste para evitar que se vea cortado en móviles */
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // URL ACTUALIZADA DE TU GOOGLE SCRIPT
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCtivmJ2j4qBeKv1uP1XuaYUbrovknJWX5N96AmAaMTBptwHM4FyIGAT6OfsNPptjE/exec"; 

        const App = () => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                fetchData();
            }, []);

            // Refrescar iconos de Lucide cuando cambie el estado
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [data, loading]);

            const fetchData = async () => {
                try {
                    setLoading(true);
                    setError(null);
                    
                    const response = await fetch(GOOGLE_SCRIPT_URL);
                    if (!response.ok) throw new Error("Error en la respuesta del servidor");
                    
                    const json = await response.json();
                    
                    if (Array.isArray(json)) {
                        setData(json);
                    } else {
                        console.error("Formato inesperado:", json);
                        setData([]);
                    }
                } catch (e) { 
                    console.error("Error de Fetch:", e);
                    setError("No se pudieron cargar los datos. Revisa la consola o los permisos del script.");
                } finally { 
                    setLoading(false); 
                }
            };

            const filteredData = useMemo(() => {
                return data.filter(item => 
                    (item.Nombre || item.nombre || "").toLowerCase().includes(searchTerm.toLowerCase()) ||
                    (item.Propietario || item.propietario || "").toLowerCase().includes(searchTerm.toLowerCase())
                );
            }, [data, searchTerm]);

            if (loading) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-[#f8fafc]">
                    <div className="spinner mb-4"></div>
                    <p className="text-slate-500 font-bold animate-pulse">Conectando con la base de datos...</p>
                </div>
            );

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto">
                    <header className="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h1 className="text-3xl font-extrabold text-slate-800 tracking-tight">CRM Hub David</h1>
                            <p className="text-slate-500 font-medium">Panel de control de ventas</p>
                        </div>
                        <button 
                            onClick={fetchData}
                            className="flex items-center justify-center gap-2 bg-white border border-slate-200 px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-all shadow-sm"
                        >
                            <i data-lucide="refresh-cw" className="w-4 h-4"></i>
                            Actualizar
                        </button>
                    </header>

                    {/* Barra de búsqueda */}
                    <div className="bg-white p-4 rounded-xl shadow-sm mb-6 border border-slate-200 flex items-center gap-3">
                        <i data-lucide="search" className="w-5 h-5 text-slate-400"></i>
                        <input 
                            type="text" 
                            placeholder="Buscar por cliente o propietario..." 
                            className="w-full outline-none text-sm text-slate-700 bg-transparent"
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                    </div>

                    {error && (
                        <div className="bg-red-50 border border-red-100 text-red-600 p-4 rounded-xl mb-6 text-sm flex items-center gap-2">
                            <i data-lucide="alert-circle" className="w-4 h-4"></i>
                            {error}
                        </div>
                    )}

                    {/* Tabla de Resultados */}
                    <div className="bg-white rounded-2xl shadow-sm overflow-hidden border border-slate-200">
                        <div className="table-container">
                            <table className="w-full text-left border-collapse">
                                <thead className="bg-slate-50 border-b border-slate-100">
                                    <tr>
                                        <th className="p-4 text-[10px] uppercase font-black text-slate-400 tracking-wider">Cliente / Propietario</th>
                                        <th className="p-4 text-[10px] uppercase font-black text-slate-400 tracking-wider text-right">Monto Mensual</th>
                                        <th className="p-4 text-[10px] uppercase font-black text-slate-400 tracking-wider text-center">Estado</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-50">
                                    {filteredData.length > 0 ? filteredData.map((item, idx) => (
                                        <tr key={idx} className="hover:bg-slate-50/50 transition-colors">
                                            <td className="p-4">
                                                <div className="font-bold text-slate-700">{item.Nombre || item.nombre || 'Sin nombre'}</div>
                                                <div className="text-[11px] text-blue-500 font-medium">{item.Propietario || item.propietario || 'Sin asignar'}</div>
                                            </td>
                                            <td className="p-4 text-right font-mono font-bold text-slate-600">
                                                ${Number(item.Valor_Mensual_ML || item.valorMensual || 0).toLocaleString('es-CO', { minimumFractionDigits: 0 })}
                                            </td>
                                            <td className="p-4 text-center">
                                                <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wide ${
                                                    (item.Cuenta_Viva || item.cuentaViva) == 1 
                                                    ? 'bg-emerald-100 text-emerald-700' 
                                                    : 'bg-slate-100 text-slate-500'
                                                }`}>
                                                    {(item.Cuenta_Viva || item.cuentaViva) == 1 ? 'Activo' : 'Inactivo'}
                                                </span>
                                            </td>
                                        </tr>
                                    )) : (
                                        <tr>
                                            <td colSpan="3" className="p-12 text-center">
                                                <div className="flex flex-col items-center gap-2 text-slate-400">
                                                    <i data-lucide="database" className="w-8 h-8 opacity-20"></i>
                                                    <p className="text-sm italic">No se encontraron registros que coincidan.</p>
                                                </div>
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <footer className="mt-8 text-center">
                        <p className="text-[10px] text-slate-400 font-medium uppercase tracking-[2px]">Powered by Google Sheets & David's Hub</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
