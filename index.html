<body>
    <div id="root"></div>

    <script type="text/babel">
        // ============= core-utils.jsx =============
        const { useState, useEffect, useMemo } = React;

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFLrUjq7YbvcY8PlKO2z7vSL-FmKZP6iPgvO59EV5LEAqM17s4BhMGKsLtikHeoVAfJg/exec";
        const MASTER_USER = "Master";
        const DEFAULT_PRIORITY_LABEL = "Prioridad";
        const DEFAULT_PRIORITY_COLOR = "#3b82f6";
        const MIN_KEYWORD_RULES = 3;
        const DEFAULT_SCORING_CONFIG = {
            keywordRules: [
                { id: "rule-flujo-comercial", keyword: "flujo comercial", points: 45 },
                { id: "rule-stock", keyword: "stock", points: 35 },
                { id: "rule-flujo-cobranzas", keyword: "flujo cobranzas", points: 30 }
            ],
            points: {
                manual: 100,
                recurrenciaCero: 60,
                recurrenciaBaja: 35,
                pausaSinRecurrencia: 40
            },
            thresholds: {
                prioridad: 70,
                critico: 40
            }
        };
        const STORAGE_KEYS = {
            scoringConfig: "crm_priority_scoring_config",
            visualConfig: "crm_priority_visual_config",
            auditManagedAt: "crm_audit_managed_at",
            recuperoScoring: "crm_recupero_scoring"
        };

        const ETAPAS_RECUPERO = [
            { id: 'acuerdo_pago',      label: 'Acuerdo de Pago',    color: 'bg-emerald-100 text-emerald-700 border-emerald-200',  dot: 'bg-emerald-500',  pideFecha: true  },
            { id: 'acuerdo_vencido',   label: 'Acuerdo Vencido',    color: 'bg-orange-100 text-orange-700 border-orange-200',     dot: 'bg-orange-500',   pideFecha: false },
            { id: 'en_negociacion',    label: 'En Negociacion',     color: 'bg-blue-100 text-blue-700 border-blue-200',           dot: 'bg-blue-500',     pideFecha: false },
            { id: 'volver_llamar',     label: 'Volver a Llamar',    color: 'bg-amber-100 text-amber-700 border-amber-200',        dot: 'bg-amber-500',    pideFecha: false },
            { id: 'sin_contacto',      label: 'Sin Contacto',       color: 'bg-slate-100 text-slate-500 border-slate-200',        dot: 'bg-slate-400',    pideFecha: false },
            { id: 'recuperado',        label: 'Recuperado',         color: 'bg-teal-100 text-teal-700 border-teal-200',           dot: 'bg-teal-500',     pideFecha: false },
            { id: 'perdido_definitivo',label: 'Perdido Definitivo', color: 'bg-rose-100 text-rose-700 border-rose-200',           dot: 'bg-rose-500',     pideFecha: false },
        ];

        const DEFAULT_RECUPERO_SCORING = {
            acuerdo_pago:       80,
            acuerdo_vencido:    20,
            en_negociacion:     50,
            volver_llamar:      30,
            sin_contacto:       10,
            recuperado:         100,
            perdido_definitivo: 0
        };
        const ETAPAS_RECUPERO_MAP = new Map(ETAPAS_RECUPERO.map(et => [et.id, et]));
        const ETAPAS_RECUPERO_EDITABLES = ETAPAS_RECUPERO.filter(et => et.id !== 'acuerdo_vencido');

        const getEffectiveRecuperoStage = (item) => {
            if (item?._acuerdoVencido) return 'acuerdo_vencido';
            return item?.etapaGestion || '';
        };

        const isRecuperoRecoveredStage = (stage) => {
            const normalized = String(stage || "").trim().toLowerCase();
            return normalized === "recuperado" || normalized === "recuperada";
        };

        const isRecuperoLostStage = (stage) => {
            const normalized = String(stage || "").trim().toLowerCase();
            return normalized === "perdido definitivo" || normalized === "perdida";
        };

        const compareRecuperoAsesorItems = (a, b, scoringMap) => {
            const aVencido = a._acuerdoVencido ? 1 : 0;
            const bVencido = b._acuerdoVencido ? 1 : 0;
            if (aVencido !== bVencido) return bVencido - aVencido;

            const etapaA = getEffectiveRecuperoStage(a);
            const etapaB = getEffectiveRecuperoStage(b);
            const aSin = !etapaA ? 1 : 0;
            const bSin = !etapaB ? 1 : 0;
            if (aSin !== bSin) return bSin - aSin;

            const scoreDiff = (scoringMap[etapaB] ?? 0) - (scoringMap[etapaA] ?? 0);
            if (scoreDiff !== 0) return scoreDiff;

            return String(a.nombre || "").localeCompare(String(b.nombre || ""));
        };

        const compareRecuperoPanelItems = (a, b, scoringMap) => {
            const aFinal = a.recuperada;
            const bFinal = b.recuperada;
            if (aFinal && !bFinal) return 1;
            if (!aFinal && bFinal) return -1;
            if (aFinal && bFinal) return 0;

            const aVencido = a._acuerdoVencido ? 1 : 0;
            const bVencido = b._acuerdoVencido ? 1 : 0;
            if (aVencido !== bVencido) return bVencido - aVencido;

            const etapaA = getEffectiveRecuperoStage(a);
            const etapaB = getEffectiveRecuperoStage(b);
            const aSinGestion = !etapaA ? 1 : 0;
            const bSinGestion = !etapaB ? 1 : 0;
            if (aSinGestion !== bSinGestion) return bSinGestion - aSinGestion;

            const fechaGestionA = parseInt(a.fechaRecupero, 10) || 0;
            const fechaGestionB = parseInt(b.fechaRecupero, 10) || 0;
            if (fechaGestionA !== fechaGestionB) return fechaGestionA - fechaGestionB;

            const scoreA = scoringMap[etapaA] ?? 0;
            const scoreB = scoringMap[etapaB] ?? 0;
            if (scoreA !== scoreB) return scoreB - scoreA;

            return String(a.nombre || "").localeCompare(String(b.nombre || ""));
        };

        // Verifica si un acuerdo de pago esta vencido
        const parseSheetDate = (value) => {
            if (!value) return null;
            if (value instanceof Date && !Number.isNaN(value.getTime())) return value;

            const raw = String(value).trim();
            if (!raw) return null;

            if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) {
                const parsed = new Date(`${raw}T00:00:00`);
                return Number.isNaN(parsed.getTime()) ? null : parsed;
            }

            if (/^\d{4}-\d{2}-\d{2}T/.test(raw)) {
                const parsed = new Date(raw);
                return Number.isNaN(parsed.getTime()) ? null : parsed;
            }

            const slashMatch = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (slashMatch) {
                const [, day, month, year] = slashMatch;
                const parsed = new Date(`${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}T00:00:00`);
                return Number.isNaN(parsed.getTime()) ? null : parsed;
            }

            const parsed = new Date(raw);
            return Number.isNaN(parsed.getTime()) ? null : parsed;
        };

        const normalizeSheetDate = (value) => {
            const parsed = parseSheetDate(value);
            if (!parsed) return '';
            const year = parsed.getFullYear();
            const month = String(parsed.getMonth() + 1).padStart(2, '0');
            const day = String(parsed.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const isAcuerdoVencido = (rec) => {
            if (rec.etapaGestion !== 'acuerdo_pago') return false;
            if (!rec.fechaAcuerdo) return false;
            const hoy = new Date();
            hoy.setHours(0,0,0,0);
            const fecha = parseSheetDate(rec.fechaAcuerdo);
            if (!fecha) return false;
            fecha.setHours(0,0,0,0);
            return fecha < hoy;
        };
        const DEFINICION_CANDIDATES = [
            "definicion",
            "Definicion",
            "DefiniciÃ³n",
            "DEFINICION",
            "DEFINICIÃ“N",
            "columnaV",
            "Columna V",
            "V",
            "v",
            "actividad",
            "Actividad",
            "ACTIVIDAD"
        ];

        const normalizeKey = (key) => String(key || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-zA-Z0-9]/g, "")
            .toLowerCase();

        const getFieldValue = (obj, candidates) => {
            if (!obj || typeof obj !== "object") return undefined;

            for (const key of candidates) {
                if (Object.prototype.hasOwnProperty.call(obj, key) && obj[key] !== undefined && obj[key] !== null && obj[key] !== "") {
                    return obj[key];
                }
            }

            const normalizedEntries = Object.entries(obj).map(([k, v]) => [normalizeKey(k), v]);
            const normalizedMap = new Map(normalizedEntries);

            for (const key of candidates) {
                const value = normalizedMap.get(normalizeKey(key));
                if (value !== undefined && value !== null && value !== "") return value;
            }

            return undefined;
        };

        const normalizeItem = (item) => ({
            ...item,
            prioridad: String(item.prioridad).toUpperCase() === "TRUE" || item.prioridad === true || item.prioridad === 1,
            recurrencia: parseFloat(item.recurrencia) || 0,
            cuentaViva: parseInt(item.cuentaViva, 10) || 0,
            definicion: String(getFieldValue(item, DEFINICION_CANDIDATES) ?? "#N/D").trim() || "#N/D"
        });

        const normalizeRecuperoItem = (item) => ({
            id:                  item.id,
            nombre:              item.nombre,
            propietarioOriginal: item.propietarioOriginal || '',
            definicion:          item.definicion || '#N/D',
            valorOriginal:       parseFloat(item.valorOriginal) || 0,
            valorRecuperado:     parseFloat(item.valorRecuperado) || 0,
            estadoChurn:         item.estadoChurn || '',
            asesorRecupero:      item.ejecutivoRecupero || item.asesorRecupero || '',
            notaRecupero:        item.gestionRecupero || item.notaRecupero || '',
            etapaGestion:        item.etapaGestion || '',
            fechaAcuerdo:        normalizeSheetDate(item.fechaAcuerdo),
            fechaIngreso:        item.fechaIngreso ? new Date(item.fechaIngreso).getTime() : Date.now(),
            fechaRecupero:       item.fechaRecupero ? new Date(item.fechaRecupero).getTime() : 0,
            recuperada:          item.recuperada === true
        });

        const readJSONStorage = (key) => {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                console.error(`Error loading ${key}:`, e);
                return null;
            }
        };

        const writeJSONStorage = (key, value) => {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {
                console.error(`Error saving ${key}:`, e);
            }
        };

        const createInitialFocoItem = () => ({
            id: "",
            nombre: "",
            valorMensual: 0,
            recurrencia: "",
            cuentaViva: 1,
            definicion: "Flujo Comercial",
            actividad: "",
            prioridad: true
        });

        const getPriorityTextColor = (hex) => {
            const color = String(hex || "").replace("#", "");
            if (color.length !== 6) return "#ffffff";
            const r = parseInt(color.substring(0, 2), 16);
            const g = parseInt(color.substring(2, 4), 16);
            const b = parseInt(color.substring(4, 6), 16);
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
            return luminance > 186 ? "#0f172a" : "#ffffff";
        };

        const createScoreRule = (keyword = "", points = 20) => ({
            id: `rule-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
            keyword,
            points
        });

        const getOrigenSegment = (priorityType) => {
            if (priorityType === "manual") return "Manual";
            return "Sin Prioridad";
        };

        const ensureMinKeywordRules = (rules) => {
            const baseRules = Array.isArray(rules) ? rules.slice() : [];
            while (baseRules.length < MIN_KEYWORD_RULES) {
                baseRules.push(createScoreRule("", 20));
            }
            return baseRules;
        };

        const sanitizeScoringConfig = (cfg) => {
            const source = cfg && typeof cfg === "object" ? cfg : {};
            const rawKeywordRules = Array.isArray(source.keywordRules) ? source.keywordRules : [];
            const keywordRules = rawKeywordRules
                .map(rule => ({
                    id: String(rule.id || createScoreRule().id),
                    keyword: String(rule.keyword || "").toLowerCase().trim(),
                    points: parseInt(rule.points, 10) || 0
                }))
                .filter(rule => rule.keyword.length > 0);

            const points = {
                manual: parseInt(source?.points?.manual, 10),
                recurrenciaCero: parseInt(source?.points?.recurrenciaCero, 10),
                recurrenciaBaja: parseInt(source?.points?.recurrenciaBaja, 10),
                pausaSinRecurrencia: parseInt(source?.points?.pausaSinRecurrencia, 10)
            };

            const thresholds = {
                prioridad: parseInt(source?.thresholds?.prioridad, 10),
                critico: parseInt(source?.thresholds?.critico, 10)
            };

            return {
                keywordRules: ensureMinKeywordRules(keywordRules.length > 0 ? keywordRules : DEFAULT_SCORING_CONFIG.keywordRules),
                points: {
                    manual: Number.isFinite(points.manual) ? points.manual : DEFAULT_SCORING_CONFIG.points.manual,
                    recurrenciaCero: Number.isFinite(points.recurrenciaCero) ? points.recurrenciaCero : DEFAULT_SCORING_CONFIG.points.recurrenciaCero,
                    recurrenciaBaja: Number.isFinite(points.recurrenciaBaja) ? points.recurrenciaBaja : DEFAULT_SCORING_CONFIG.points.recurrenciaBaja,
                    pausaSinRecurrencia: Number.isFinite(points.pausaSinRecurrencia) ? points.pausaSinRecurrencia : DEFAULT_SCORING_CONFIG.points.pausaSinRecurrencia
                },
                thresholds: {
                    prioridad: Number.isFinite(thresholds.prioridad) ? thresholds.prioridad : DEFAULT_SCORING_CONFIG.thresholds.prioridad,
                    critico: Number.isFinite(thresholds.critico) ? thresholds.critico : DEFAULT_SCORING_CONFIG.thresholds.critico
                }
            };
        };

        // ============= FUNCIÃ“N PDF MODIFICADA (usa source = focoEstrategico) =============
        const exportPdfReportFile = ({ source, fullData, recoveredData, recuperoSummary, currentUser, priorityLabel, getFocoEtiqueta }) => {
            try {
                if (!window.jspdf || !window.jspdf.jsPDF) {
                    alert("No se pudo cargar la libreria PDF. Recarga la pagina e intenta de nuevo.");
                    return;
                }

                // source ahora es el foco estratÃ©gico (manuales + automÃ¡ticos con puntaje alto)
                const metaTotal = fullData.reduce((a, b) => a + (parseFloat(b.valorMensual) || 0), 0);
                const recurrenciaTotal = fullData.reduce((a, b) => a + (parseFloat(b.recurrencia) || 0), 0);
                const recurrenciaCero = fullData.filter(d => (parseFloat(d.recurrencia) || 0) === 0).length;
                const avance = metaTotal > 0 ? (recurrenciaTotal / metaTotal) * 100 : 0;
                const totalClientes = fullData.length;
                const divisorClientes = totalClientes || 1;
                const churnPct = totalClientes > 0 ? (recurrenciaCero / totalClientes) * 100 : 0;

                const estadoRows = [
                    {
                        estado: "Vivo",
                        clientes: fullData.filter(d => d.cuentaViva === 1).length,
                        meta: fullData.filter(d => d.cuentaViva === 1).reduce((a, b) => a + (parseFloat(b.valorMensual) || 0), 0)
                    },
                    {
                        estado: "Pausado",
                        clientes: fullData.filter(d => d.cuentaViva === 2).length,
                        meta: fullData.filter(d => d.cuentaViva === 2).reduce((a, b) => a + (parseFloat(b.valorMensual) || 0), 0)
                    },
                    {
                        estado: "Cerrado",
                        clientes: fullData.filter(d => d.cuentaViva === 0).length,
                        meta: fullData.filter(d => d.cuentaViva === 0).reduce((a, b) => a + (parseFloat(b.valorMensual) || 0), 0)
                    }
                ];

                const definicionMap = fullData.reduce((acc, item) => {
                    const key = (item.definicion || "#N/D").trim() || "#N/D";
                    acc[key] = (acc[key] || 0) + 1;
                    return acc;
                }, {});
                const definicionData = Object.entries(definicionMap)
                    .map(([label, value]) => ({ label, value }))
                    .sort((a, b) => b.value - a.value);
                const pieColors = [
                    [59, 130, 246],
                    [16, 185, 129],
                    [245, 158, 11],
                    [244, 63, 94],
                    [100, 116, 139],
                    [139, 92, 246]
                ];

                // Totales del foco (para la tabla de detalle)
                const totalFocoMeta = source.reduce(
                (acc, item) => acc + (parseFloat(item.valorMensual) || 0),
                 0
                );   
                const totalFocoRec = source.reduce(
                (acc, item) => acc + (parseFloat(item.recurrencia) || 0),
                0
                );    

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF("p", "mm", "a4");
                const pageW = doc.internal.pageSize.getWidth();
                const margin = 12;
                const summary = recuperoSummary && typeof recuperoSummary === "object"
                    ? recuperoSummary
                    : { totalIngresadas: 0, recuperadas: 0, perdidas: 0, pendientes: 0, tasaRecuperacion: 0 };

                // ========== PÃGINA 1 ==========
                doc.setFillColor(15, 23, 42);
                doc.rect(0, 0, pageW, 28, "F");
                doc.setTextColor(255, 255, 255);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(16);
                doc.text("Reporte Ejecutivo CRM", margin, 12);
                doc.setFontSize(9);
                doc.text(`Canal: ${currentUser || "Todos"} | Fecha: ${new Date().toLocaleDateString("es-CO")}`, margin, 19);

                const cardW = (pageW - margin * 2 - 8) / 3;
                const drawMetricCard = (x, y, title, value) => {
                    doc.setDrawColor(226, 232, 240);
                    doc.setFillColor(248, 250, 252);
                    doc.roundedRect(x, y, cardW, 18, 2, 2, "FD");
                    doc.setTextColor(100, 116, 139);
                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(8);
                    doc.text(title, x + 3, y + 6);
                    doc.setTextColor(15, 23, 42);
                    doc.setFontSize(10);
                    doc.text(value, x + 3, y + 13);
                };
                drawMetricCard(margin, 34, "Avance", `${avance.toFixed(1)}%`);
                drawMetricCard(margin + cardW + 4, 34, "Meta Total", `$${metaTotal.toLocaleString()}`);
                drawMetricCard(margin + (cardW + 4) * 2, 34, "Recurrencia", `$${recurrenciaTotal.toLocaleString()}`);

                const tableX = margin;
                const tableY = 58;
                const tableW = pageW - margin * 2;
                const rowH = 9;
                doc.setDrawColor(203, 213, 225);
                doc.setFillColor(248, 250, 252);
                doc.roundedRect(tableX, tableY, tableW, 41, 2, 2, "FD");
                doc.setTextColor(15, 23, 42);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(10);
                doc.text("Tabla Estado / Clientes / Meta", tableX + 3, tableY + 6);

                const colEstado = tableX + 3;
                const colClientes = tableX + 55;
                const colMeta = tableX + 88;
                doc.setFillColor(226, 232, 240);
                doc.rect(tableX + 2, tableY + 9, tableW - 4, rowH - 1, "F");
                doc.setFontSize(8);
                doc.text("Estado", colEstado, tableY + 15);
                doc.text("Clientes", colClientes, tableY + 15);
                doc.text("Meta Total", colMeta, tableY + 15);

                estadoRows.forEach((row, idx) => {
                    const y = tableY + 9 + rowH + idx * rowH;
                    doc.setDrawColor(226, 232, 240);
                    doc.line(tableX + 2, y + rowH - 1, tableX + tableW - 2, y + rowH - 1);
                    doc.setTextColor(51, 65, 85);
                    doc.text(row.estado, colEstado, y + 6);
                    doc.text(String(row.clientes), colClientes, y + 6);
                    doc.text(`$${Math.round(row.meta).toLocaleString()}`, colMeta, y + 6);
                });

                const pieBoxX = margin;
                const pieBoxY = 104;
                const pieBoxW = pageW - margin * 2;
                const pieBoxH = 82;
                doc.setDrawColor(203, 213, 225);
                doc.setFillColor(248, 250, 252);
                doc.roundedRect(pieBoxX, pieBoxY, pieBoxW, pieBoxH, 2, 2, "FD");
                doc.setTextColor(15, 23, 42);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(10);
                doc.text("Distribucion % por Definicion", pieBoxX + 3, pieBoxY + 6);

                const pieCanvas = document.createElement("canvas");
                pieCanvas.width = 260;
                pieCanvas.height = 260;
                const ctx = pieCanvas.getContext("2d");
                if (ctx && definicionData.length > 0) {
                    const total = definicionData.reduce((acc, d) => acc + d.value, 0) || 1;
                    let start = -Math.PI / 2;
                    definicionData.forEach((item, i) => {
                        const angle = (item.value / total) * Math.PI * 2;
                        ctx.beginPath();
                        ctx.moveTo(130, 130);
                        ctx.arc(130, 130, 110, start, start + angle);
                        ctx.closePath();
                        const c = pieColors[i % pieColors.length];
                        ctx.fillStyle = `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
                        ctx.fill();
                        start += angle;
                    });
                    doc.addImage(pieCanvas.toDataURL("image/png"), "PNG", pieBoxX + 4, pieBoxY + 10, 56, 56);
                } else {
                    doc.setTextColor(100, 116, 139);
                    doc.setFontSize(8);
                    doc.text("Sin datos para graficar.", pieBoxX + 6, pieBoxY + 18);
                }

                doc.setFontSize(8);
                doc.setTextColor(71, 85, 105);

            const [autoRulesInput, setAutoRulesInput] = useState(() =>
                scoringConfig.keywordRules.map(rule => `${rule.keyword}:${rule.points}`).join(", ")
            );

            const fetchData = async () => {
                try {
                    setLoading(true);
                    setFetchError(null);
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'GET',
                        redirect: 'follow'
                    });
                    const text = await response.text();
                    let json;
                    try {
                        json = JSON.parse(text);
                    } catch(parseErr) {
                        throw new Error('Respuesta no es JSON vÃ¡lido: ' + text.substring(0, 200));
                    }

                    // El script devuelve { bd: [...], recupero: [...], recuperoCerrados: [...] }
                    // pero soportamos tambiÃ©n el formato antiguo (array directo)
                    if (Array.isArray(json)) {
                        setData(json.map(normalizeItem));
                    } else if (json && Array.isArray(json.bd)) {
                        setData(json.bd.map(normalizeItem));
                        setRecuperoList(Array.isArray(json.recupero) ? json.recupero.map(r => normalizeRecuperoItem({ ...r, recuperada: false })) : []);
                        setRecuperoClosedList(Array.isArray(json.recuperoCerrados) ? json.recuperoCerrados.map(r => normalizeRecuperoItem({ ...r, recuperada: true })) : []);
                    } else {
                        throw new Error('Formato de respuesta inesperado: ' + JSON.stringify(json).substring(0, 200));
                    }
                } catch (e) {
                    console.error("Error fetching:", e);
                    setFetchError(e.message || String(e));
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { fetchData(); }, []);

            // Detectar acuerdos vencidos automÃ¡ticamente al cargar y cada hora
            useEffect(() => {
                const checkVencidos = () => {
                    setRecuperoList(prev => prev.map(r => {
                        if (r.etapaGestion === 'acuerdo_pago' && isAcuerdoVencido(r) && !r.recuperada) {
                            return { ...r, _acuerdoVencido: true };
                        }
                        return { ...r, _acuerdoVencido: false };
                    }));
                };
                checkVencidos();
                const interval = setInterval(checkVencidos, 60 * 60 * 1000);
                return () => clearInterval(interval);
            }, [recuperoList.length]);
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [
                loading,
                currentUser,
                activeTab,
                showRulesPanel,
                data.length,
                recuperoList.length,
                asesoresRecupero.length
            ]);
            useEffect(() => {
                const managed = readJSONStorage(STORAGE_KEYS.auditManagedAt);
                if (!managed || typeof managed !== "object") return;
                setLastManagedAt(managed);
            }, []);

            const updateItem = async (updatedItem, isClosing = false) => {
                setSaving(true);
                const finalItem = isClosing ? { ...updatedItem, prioridad: false } : updatedItem;
                if (isClosing) {
                    setGestionados(prev => [...prev, finalItem.id]);
                    setLastManagedAt(prev => {
                        const next = { ...prev, [String(finalItem.id)]: Date.now() };
                        writeJSONStorage(STORAGE_KEYS.auditManagedAt, next);
                        return next;
                    });
                }

                // --- BOLSA DE RECUPERO: detectar cambio a pausado (2) o cerrado (0) ---
                setData(prevData => {
                    const existing = prevData.find(d => String(d.id) === String(finalItem.id));
                    const wasVivo = existing && existing.cuentaViva === 1;
                    const nowInactivo = finalItem.cuentaViva === 0 || finalItem.cuentaViva === 2;
                    if (wasVivo && nowInactivo) {
                        setRecuperoList(prev => {
                            const alreadyIn = prev.some(r => String(r.id) === String(finalItem.id));
                            if (alreadyIn) return prev;
                            return [{
                                id: finalItem.id,
                                nombre: finalItem.nombre,
                                propietarioOriginal: finalItem.propietario || "",
                                valorOriginal: parseFloat(finalItem.valorMensual) || 0,
                                valorRecuperado: parseFloat(finalItem.valorMensual) || 0,
                                estadoChurn: finalItem.cuentaViva === 2 ? "Pausado" : "Cerrado",
                                asesorRecupero: "",
                                notaRecupero: "",
                                fechaIngreso: Date.now(),
                                recuperada: false,
                                definicion: finalItem.definicion || "#N/D"
                            }, ...prev];
                        });
                    }
                    const exists = prevData.some(d => String(d.id) === String(finalItem.id));
                    if (exists) return prevData.map(d => String(d.id) === String(finalItem.id) ? finalItem : d);
                    return [finalItem, ...prevData];
                });
                // --- FIN BOLSA ---

                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify(finalItem)
                    });
                } catch (e) {
                    console.error("Error updating:", e);
                } finally {
                    setTimeout(() => setSaving(false), 300);
                }
            };

            // Guardar gestion de recupero (cualquier etapa)
            const guardarGestionRecupero = async (recuperoItem) => {
                const draft = recuperoDrafts[recuperoItem.id] || {};
                const merged = { ...recuperoItem, ...draft };
                const asesor = merged.asesorRecupero || '';
                const etapa  = merged.etapaGestion   || '';

                if (!asesor) { alert("Debes indicar el asesor de recupero."); return; }
                if (!etapa)  { alert("Debes seleccionar una etapa de gestion."); return; }
                if (!String(merged.notaRecupero || "").trim()) {
                    alert("Debes escribir un comentario de gestion.");
                    return;
                }

                // Validar fecha si es acuerdo de pago
                if (etapa === 'acuerdo_pago' && !merged.fechaAcuerdo) {
                    alert("Debes ingresar la fecha del acuerdo de pago.");
                    return;
                }

                const esFinal    = etapa === 'recuperado' || etapa === 'perdido_definitivo';
                const valorRec   = parseFloat(merged.valorRecuperado) || 0;
                const etapaLabel = ETAPAS_RECUPERO.find(e => e.id === etapa)?.label || etapa;

                if (etapa === 'recuperado' && valorRec <= 0) {
                    alert("Debes ingresar un valor recuperado mayor a 0 para marcar la cuenta como recuperada.");
                    return;
                }

                const payload = {
                    id:               recuperoItem.id,
                    nombre:           recuperoItem.nombre,
                    propietario:      recuperoItem.propietarioOriginal,
                    definicion:       recuperoItem.definicion,
                    estadoChurn:      recuperoItem.estadoChurn,
                    _accion:          "recupero",
                    _valorOriginal:   merged.valorOriginal,
                    _valorRecuperado: valorRec,
                    _diferencia:      merged.valorOriginal - valorRec,
                    _asesorRecupero:  asesor,
                    _notaRecupero:    merged.notaRecupero || "",
                    _etapaGestion:    etapaLabel,
                    _fechaAcuerdo:    etapa === 'acuerdo_pago' ? merged.fechaAcuerdo : "",
                    _fechaRecupero:   new Date().toISOString()
                };

                // Si es etapa final, incluir datos para actualizar BD
                if (esFinal) {
                    payload.cuentaViva = etapa === 'recuperado' ? 1 : 0;
                    payload.recurrencia = etapa === 'recuperado' ? valorRec : 0;
                    payload.actividad = `[${etapaLabel}] por ${asesor}. Valor original: $${merged.valorOriginal}. Valor recuperado: $${valorRec}. ${merged.notaRecupero || ""}`.trim();
                }

                // Actualizar BD local si es final
                if (esFinal) {
                    const cuentaOriginal = data.find(d => String(d.id) === String(recuperoItem.id));
                    if (cuentaOriginal) {
                        setData(prev => prev.map(d => String(d.id) === String(recuperoItem.id)
                            ? { ...d, cuentaViva: etapa === 'recuperado' ? 1 : 0, recurrencia: etapa === 'recuperado' ? valorRec : 0 }
                            : d
                        ));
                    }
                }

                // Actualizar bolsa local
                const closedItem = {
                    ...recuperoItem,
                    ...draft,
                    etapaGestion: etapa,
                    recuperada: esFinal,
                    fechaRecupero: Date.now(),
                    valorRecuperado: valorRec,
                    asesorRecupero: asesor,
                    notaRecupero: merged.notaRecupero || "",
                    fechaAcuerdo: etapa === 'acuerdo_pago' ? merged.fechaAcuerdo : ""

                if (esFinal) {
                    setRecuperoList(prev => prev.filter(r => String(r.id) !== String(recuperoItem.id)));
                    setRecuperoClosedList(prev => {

                        return [closedItem, ...next];

                        ? closedItem
                        : r
                    ));

                setRecuperoDrafts(prev => { const n = {...prev}; delete n[recuperoItem.id]; return n; });

                setSaving(true);
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)

                    .catch(e => console.error("Error gestion:", e))
                    .finally(() => {
                        setTimeout(() => setSaving(false), 300);
                    });

            const createNewFromFoco = async () => {

                }

            // ============= 2. DERIVED DATA (cÃ¡lculos) =============
            const calculateItemScore = (item) => {
                const recurrencia = parseFloat(item.recurrencia) || 0;
                const meta = parseFloat(item.valorMensual) || 0;
                const definicion = String(item.definicion || "").toLowerCase();

                let score = 0;
                if (item.prioridad) score += scoringConfig.points.manual;
                if (recurrencia === 0) score += scoringConfig.points.recurrenciaCero;
                if (item.cuentaViva === 2 && (recurrencia === 0 || recurrencia === 2)) score += scoringConfig.points.pausaSinRecurrencia;
                if (item.cuentaViva === 1 && meta > 0 && recurrencia < (meta * 0.5)) score += scoringConfig.points.recurrenciaBaja;

                const keywordsScore = scoringConfig.keywordRules.reduce((acc, rule) => {
                    if (!rule.keyword) return acc;
                    return definicion.includes(rule.keyword) ? acc + (parseInt(rule.points, 10) || 0) : acc;
                }, 0);

                const baseScore = score + keywordsScore;
                if (!item.prioridad) return baseScore;
                if (definicion.includes("flujo comercial")) return baseScore * 1.25;
                if (definicion.includes("stock")) return baseScore * 1.15;
                return baseScore;
            };

            const isPriority = (item) => {
                return item.prioridad ? "manual" : null;
            };

            const getFocoEtiqueta = (item) => {
                if (item.prioridad) return priorityLabel;
                const score = calculateItemScore(item);
                if (score >= scoringConfig.thresholds.critico) return "Critico";
                return "Normal";
            };

            const getNivel = (item) => {
                const score = calculateItemScore(item);
                const alertThreshold = Math.max(1, Math.floor(scoringConfig.thresholds.critico * 0.6));
                if (score >= scoringConfig.thresholds.prioridad) return "Urgente";
                if (score >= scoringConfig.thresholds.critico) return "Critico";
                if (score >= alertThreshold) return "Alerta";
                return "Normal";
            };

            const getEstadoTexto = (val) => {
                if (val === 1) return "Vivo";
                if (val === 2) return "Pausa";
                return "Cerrado";
            };

            const getSlaBucket = (item) => {
                const managedAt = parseInt(lastManagedAt[String(item.id)], 10);
                const nivel = getNivel(item);
                if (!Number.isFinite(managedAt)) {
                    if (nivel === "Urgente") return "Hoy";
                    if (nivel === "Critico") return "48h";
                    return "Semana";
                }
                const elapsedHours = (Date.now() - managedAt) / (1000 * 60 * 60);
                if (elapsedHours <= 24) return "Hoy";
                if (elapsedHours <= 48) return "48h";
                return "Semana";
            };

            const currentUserRol = currentUser === MASTER_USER ? 'master'
                : asesoresRecupero.includes(currentUser) ? 'recupero'
                : 'consultor';

            // ============= 3. VIEW DATA (ordenamiento, filtros, mÃ©tricas) =============
            const propietariosDisponibles = useMemo(() => {
                const unique = [...new Set(data.map(d => d.propietario))]
                    .filter(Boolean)

                    .sort();
                return [MASTER_USER, ...unique];
            }, [data]);

            const userFilteredData = useMemo(() => {
                if (!currentUser || currentUser === MASTER_USER) return data;
                return data.filter(d => d.propietario === currentUser);
            }, [data, currentUser]);

            const definicionesDisponibles = useMemo(() => ([
                "Todos",
                "Flujo Cobranzas",
                "Flujo Comercial",
                "Stock Cobranzas",
                "Stock Comercial",
                "#N/D"
            ]), []);

            const finalData = useMemo(() => {
                return userFilteredData.filter(d => {
                    const matchSearch = d.nombre.toLowerCase().includes(searchTerm.toLowerCase()) || String(d.id).includes(searchTerm);
                    const matchEstado = filterEstado === 'Todos' || getEstadoTexto(d.cuentaViva) === filterEstado;
                    const matchDefinicion = filterDefinicion === 'Todos' || d.definicion === filterDefinicion;
                    return matchSearch && matchEstado && matchDefinicion;
                });
            }, [userFilteredData, searchTerm, filterEstado, filterDefinicion]);

            // ***** FOCO ESTRATÃ‰GICO: manuales + automÃ¡ticos que superan umbral de prioridad *****
            const focoEstrategico = useMemo(() => {
                const noGestionados = finalData.filter(d => !gestionados.includes(d.id));
                return noGestionados
                    .filter(d => d.prioridad || calculateItemScore(d) >= scoringConfig.thresholds.prioridad)
                    .slice()
                    .sort((a, b) => {
                        if (a.prioridad && !b.prioridad) return -1;
                        if (!a.prioridad && b.prioridad) return 1;
                        const scoreDiff = calculateItemScore(b) - calculateItemScore(a);
                        if (scoreDiff !== 0) return scoreDiff;
                        return String(a.nombre || "").localeCompare(String(b.nombre || ""));
                    });
            }, [finalData, gestionados, scoringConfig]);

            // ***** MÃ‰TRICAS: crÃ­ticos ahora usa focoEstrategico.length *****
            const metrics = useMemo(() => {
                const target = userFilteredData.reduce((a, b) => a + (parseFloat(b.valorMensual) || 0), 0);
                const real = userFilteredData.reduce((a, b) => a + (parseFloat(b.recurrencia) || 0), 0);
                const criticos = focoEstrategico.length;   // â† cambio importante
                const avance = target > 0 ? (real / target) * 100 : 0;
                return { target, real, criticos, avance };
            }, [userFilteredData, focoEstrategico]);

            const monitorAuditoriaData = useMemo(() => {
                const manualesEnFocoIds = new Set(
                    focoEstrategico.filter(item => item.prioridad).map(item => String(item.id))
                );
                return finalData.filter(item => !manualesEnFocoIds.has(String(item.id)));
            }, [finalData, focoEstrategico]);

            const recuperoStats = useMemo(() => {
                const pendientes = recuperoList.length;
                const recuperadas = recuperoClosedList.filter(item => isRecuperoRecoveredStage(item.etapaGestion)).length;
                const valorEnRiesgo = recuperoList.reduce((acc, item) => acc + (item.valorOriginal || 0), 0);
                return { pendientes, recuperadas, valorEnRiesgo };
            }, [recuperoList, recuperoClosedList]);

            const recuperoSummary = useMemo(() => {
                const closedVisibleItems = currentUser === MASTER_USER
                    ? recuperoClosedList
                    : recuperoClosedList.filter(item => item.propietarioOriginal === currentUser);
                const activeVisibleItems = currentUser === MASTER_USER
                    ? recuperoList
                    : recuperoList.filter(item => item.propietarioOriginal === currentUser);

                const recuperadas = closedVisibleItems.filter(item => isRecuperoRecoveredStage(item.etapaGestion)).length;
                const perdidas = closedVisibleItems.filter(item => isRecuperoLostStage(item.etapaGestion)).length;
                const pendientes = activeVisibleItems.length;
                const totalIngresadas = recuperadas + perdidas + pendientes;
                const tasaRecuperacion = totalIngresadas > 0 ? (recuperadas / totalIngresadas) * 100 : 0;

                return { totalIngresadas, recuperadas, perdidas, pendientes, tasaRecuperacion };
            }, [currentUser, recuperoClosedList, recuperoList]);

            const recuperoViewMap = useMemo(() => {
                return recuperoList.reduce((acc, rec) => {
                    const draft = recuperoDrafts[rec.id] || {};
                    const merged = { ...rec, ...draft };
                    const acuerdoVencido = merged.etapaGestion === 'acuerdo_pago' && isAcuerdoVencido(merged) && !merged.recuperada;
                    const etapaEfectiva = acuerdoVencido ? 'acuerdo_vencido' : merged.etapaGestion;
                    const valorRec = parseFloat(merged.valorRecuperado) || 0;
                    const diferencia = (merged.valorOriginal || 0) - valorRec;
                    const etapaActual = ETAPAS_RECUPERO_MAP.get(etapaEfectiva);
                    const esFinal = merged.etapaGestion === 'recuperado' || merged.etapaGestion === 'perdido_definitivo';

                    acc[rec.id] = {
                        ...merged,
                        _acuerdoVencido: acuerdoVencido,
                        _etapaEfectiva: etapaEfectiva,
                        _draft: draft,
                        _valorRec: valorRec,
                        _diferencia: diferencia,
                        _etapaActual: etapaActual,
                        _esFinal: esFinal,
                        _valorRecuperadoInputEmpty: merged.valorRecuperado === 0 && !draft.valorRecuperado
                    };
                    return acc;
                }, {});
            }, [recuperoList, recuperoDrafts]);

            const sortedRecuperoList = useMemo(() => {
                return [...recuperoList].sort((a, b) => compareRecuperoPanelItems(a, b, recuperoScoring));
            }, [recuperoList, recuperoScoring]);

            const recoveredRecuperoData = useMemo(() => {
                const activeRecoveredItems = sortedRecuperoList
                    .map(item => recuperoViewMap[item.id] || item)
                    .filter(item => item.recuperada || item.etapaGestion === 'recuperado');
                const recoveredItemsMap = new Map();

                [...recuperoClosedList, ...activeRecoveredItems].forEach(item => {
                    recoveredItemsMap.set(String(item.id), item);
                });

                const recoveredItems = [...recoveredItemsMap.values()];

                if (!currentUser || currentUser === MASTER_USER) return recoveredItems;
                return recoveredItems.filter(item => item.propietarioOriginal === currentUser);
            }, [sortedRecuperoList, recuperoViewMap, recuperoClosedList, currentUser]);

            const monitorFilteredData = useMemo(() => {
                return monitorAuditoriaData.filter(item => {
                    const priorityType = isPriority(item);
                    const origen = getOrigenSegment(priorityType);
                    const matchOrigen = filterOrigen === "Todos" || origen === filterOrigen;
                    const sla = getSlaBucket(item);
                    const matchSla = filterSla === "Todos" || sla === filterSla;
                    return matchOrigen && matchSla;
                });
            }, [monitorAuditoriaData, filterOrigen, filterSla, lastManagedAt]);

            const updateKeywordRule = (ruleId, patch) => {
                setScoringConfig(prev => ({
                    ...prev,
                    keywordRules: prev.keywordRules.map(rule => rule.id === ruleId ? { ...rule, ...patch } : rule)
                }));
            };

            const addKeywordRule = () => {
                setScoringConfig(prev => ({
                    ...prev,
                    keywordRules: [...prev.keywordRules, createScoreRule("", 20)]
                }));
            };

            const removeKeywordRule = (ruleId) => {
                setScoringConfig(prev => {
                    if (prev.keywordRules.length <= MIN_KEYWORD_RULES) {
                        alert(`Debes mantener al menos ${MIN_KEYWORD_RULES} reglas.`);
                        return prev;
                    }
                    return {
                        ...prev,
                        keywordRules: prev.keywordRules.filter(rule => rule.id !== ruleId)
                    };
                });
            };

            const saveScoringRules = () => {
                const cleanedConfig = sanitizeScoringConfig(scoringConfig);
                setScoringConfig(cleanedConfig);
                setAutoRulesInput(cleanedConfig.keywordRules.map(rule => `${rule.keyword}:${rule.points}`).join(", "));
                writeJSONStorage(STORAGE_KEYS.scoringConfig, cleanedConfig);
                writeJSONStorage(STORAGE_KEYS.visualConfig, {
                    label: priorityLabel || DEFAULT_PRIORITY_LABEL,
                    color: priorityColor || DEFAULT_PRIORITY_COLOR
                });
                alert("Scoring actualizado.");
            };

            const clearScoringRules = () => {
                setScoringConfig(DEFAULT_SCORING_CONFIG);
                setAutoRulesInput(DEFAULT_SCORING_CONFIG.keywordRules.map(rule => `${rule.keyword}:${rule.points}`).join(", "));
                setPriorityLabel(DEFAULT_PRIORITY_LABEL);
                setPriorityColor(DEFAULT_PRIORITY_COLOR);
                localStorage.removeItem(STORAGE_KEYS.scoringConfig);
                localStorage.removeItem(STORAGE_KEYS.visualConfig);
                alert("Scoring restablecido.");
            };

            const exportPdfReport = () => {
                exportPdfReportFile({
                    source: focoEstrategico,
                    fullData: userFilteredData,
                    recoveredData: recoveredRecuperoData,
                    recuperoSummary,
                    currentUser,
                    priorityLabel,
                    getFocoEtiqueta
                });
            };

            const exportRecuperoReport = () => {
                exportRecuperoPdfFile({
                    recuperoData: recoveredRecuperoData,
                    currentUser
                });

            const misCuentas = useMemo(() => {
                if (currentUserRol !== 'recupero') return [];
                return recuperoList.filter(r =>
                    !r.recuperada &&
                    (r.asesorRecupero === currentUser || recuperoDrafts[r.id]?.asesorRecupero === currentUser)
                );

                return [...misCuentas].sort((a, b) => compareRecuperoAsesorItems(a, b, recuperoScoring));
            }, [misCuentas, recuperoScoring]);

                return misCuentas.reduce((acc, item) => acc + (item.valorOriginal || 0), 0);

            // ============= 4. UI (renderizado) =============

            if (!currentUser && !loading) return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 p-6">
                    <div className="login-card w-full max-w-2xl bg-white rounded-[3rem] p-10 shadow-2xl">

                            <div className="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center text-white mx-auto mb-6 shadow-xl">
                                <i data-lucide="shield-check" className="w-8 h-8 text-blue-400"></i>
                            </div>
                            <h2 className="text-2xl font-black text-slate-900 italic tracking-tighter mb-2">Acceso CRM Elite</h2>
                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Selecciona tu perfil para continuar</p>
                        </div>

                            {/* Columna izquierda: Consultores de Cartera */}
                            <div>
                                <div className="flex items-center gap-2 mb-3">
                                    <div className="w-6 h-6 bg-blue-600 rounded-lg flex items-center justify-center">
                                        <i data-lucide="briefcase" className="w-3 h-3 text-white"></i>
                                    </div>
                                    <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest">Consultor de Cartera</p>
                                </div>
                                <div className="space-y-2">
                                    {propietariosDisponibles.map(user => (
                                        <button
                                            key={user}

                                    <p className="text-[9px] text-slate-400 mt-1">Asigna un asesor de recupero, edita el valor recuperado y marca cuando se reactive la cuenta.</p>
                                </div>

                                {recuperoList.length === 0 ? (
                                    <div className="py-24 text-center">
                                        <i data-lucide="inbox" className="w-12 h-12 text-slate-200 mx-auto mb-4"></i>
                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Bolsa vacia - no hay cuentas en recupero</p>
                                        <p className="text-[9px] text-slate-300 mt-2">Cuando una cuenta pase a Pausada o Cerrada, aparecera aqui automaticamente.</p>
                                    </div>
                                ) : (
                                    <div className="divide-y divide-slate-50">
                                        {sortedRecuperoList.map(rec => {
                                            const merged = recuperoViewMap[rec.id] || rec;
                                            const draft = merged._draft || {};
                                            const valorRec = merged._valorRec ?? (parseFloat(merged.valorRecuperado) || 0);
                                            const diferencia = merged._diferencia ?? ((merged.valorOriginal || 0) - valorRec);
                                            const etapaActual = merged._etapaActual || ETAPAS_RECUPERO_MAP.get(merged.etapaGestion);
                                            const esFinal = merged._esFinal ?? (merged.etapaGestion === 'recuperado' || merged.etapaGestion === 'perdido_definitivo');
                                            return (
                                                <div key={rec.id} className={`p-6 md:p-8 transition-all ${rec.recuperada ? 'opacity-40 bg-slate-50/50' : ''}`}>
                                                    <div className="grid grid-cols-1 xl:grid-cols-[1fr_0.8fr_1.2fr] gap-6 items-start">

                                                        {/* Info cuenta */}
                                                        <div className="min-w-0">
                                                            <div className="flex items-center gap-2 mb-2 flex-wrap">
                                                                <span className={`text-[8px] font-black px-2 py-1 rounded-full uppercase ${rec.estadoChurn === 'Pausado' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-500'}`}>
                                                                    {rec.estadoChurn}
                                                                </span>
                                                                {etapaActual && (
                                                                    <span className={`text-[8px] font-black px-2 py-1 rounded-full uppercase border ${etapaActual.color}`}>
                                                                        <span className={`inline-block w-1.5 h-1.5 rounded-full mr-1 ${etapaActual.dot}`}></span>
                                                                        {etapaActual.label}
                                                                    </span>
                                                                )}
                                                                {rec.recuperada && <span className="text-[8px] font-black px-2 py-1 rounded-full bg-emerald-100 text-emerald-700 uppercase border border-emerald-200">Cerrada</span>}
                                                                <span className="text-[8px] font-black text-slate-400 uppercase">{rec.fechaIngreso ? new Date(rec.fechaIngreso).toLocaleDateString('es-ES') : ''}</span>
                                                            </div>
                                                            <p className="font-extrabold text-slate-900 text-sm leading-tight">{rec.nombre}</p>
                                                            <div className="flex gap-3 mt-1 flex-wrap">
                                                                <span className="text-[8px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded">ID: {rec.id}</span>
                                                                <span className="text-[8px] font-black text-slate-500 uppercase">Asesor A: {rec.propietarioOriginal}</span>
                                                                <span className="text-[8px] font-black text-slate-400">{rec.definicion}</span>
                                                            </div>
                                                        </div>

                                                        {/* Valores */}
                                                        <div className="space-y-3">
                                                            <div>
                                                                <p className="text-[8px] font-black text-slate-400 uppercase mb-1">Valor Original</p>
                                                                <p className="text-lg font-black text-slate-700">${(rec.valorOriginal||0).toLocaleString()}</p>
                                                            </div>
                                                            <div>
                                                                <p className="text-[8px] font-black text-slate-400 uppercase mb-1">Valor Recuperado</p>
                                                                {rec.recuperada ? (
                                                                    <p className="text-lg font-black text-emerald-600">${valorRec.toLocaleString()}</p>
                                                                ) : (
                                                                    <div className="flex items-center gap-1 border-b-2 border-emerald-300">
                                                                        <span className="text-slate-400 font-bold text-sm">$</span>
                                                                        <input
                                                                            type="number"
                                                                            className="w-24 bg-transparent text-center font-black text-sm p-1 focus:outline-none text-emerald-700"
                                                                            value={merged._valorRecuperadoInputEmpty ? '' : merged.valorRecuperado}
                                                                            placeholder="0"
                                                                            onChange={e => setRecuperoDrafts(prev => ({
                                                                                ...prev,
                                                                                [rec.id]: { ...(prev[rec.id]||{}), valorRecuperado: e.target.value === '' ? 0 : parseFloat(e.target.value)||0 }
                                                                            }))}
                                                                        />
                                                                    </div>
                                                                )}
                                                            </div>
                                                            <div>
                                                                <p className="text-[8px] font-black text-slate-400 uppercase mb-1">Diferencia</p>
                                                                <p className={`text-sm font-black ${diferencia > 0 ? 'text-rose-500' : 'text-emerald-600'}`}>
                                                                    {diferencia > 0 ? '-' : '+'}${Math.abs(diferencia).toLocaleString()}
                                                                </p>
                                                            </div>
                                                        </div>

                                                        {/* Gestion */}
                                                        {!rec.recuperada && (
                                                            <div className="flex flex-col gap-3 min-w-0">
                                                                {/* Selector asesor */}
                                                                <select
                                                                    className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-[10px] font-black outline-none focus:border-amber-400"
                                                                    value={merged.asesorRecupero || ''}
                                                                    onChange={e => setRecuperoDrafts(prev => ({
                                                                        ...prev,
                                                                        [rec.id]: { ...(prev[rec.id]||{}), asesorRecupero: e.target.value }
                                                                    }))}
                                                                >
                                                                    <option value="">- Asignar Asesor -</option>
                                                                    {asesoresRecupero.length === 0
                                                                        ? <option disabled>Sin asesores (agregar en Reglas)</option>
                                                                        : asesoresRecupero.map(u => <option key={u} value={u}>{u}</option>)
                                                                    }
                                                                </select>

                                                                {/* Selector etapa */}
                                                                <div className="grid grid-cols-2 gap-2">
                                                                    {ETAPAS_RECUPERO_EDITABLES.map(et => {
                                                                        const isActive = merged.etapaGestion === et.id;
                                                                        return (
                                                                            <button
                                                                                key={et.id}
                                                                                type="button"
                                                                                onClick={() => setRecuperoDrafts(prev => ({
                                                                                    ...prev,
                                                                                    [rec.id]: { ...(prev[rec.id]||{}), etapaGestion: et.id }
                                                                                }))}
                                                                                className={`rounded-xl px-3 py-2 text-[9px] font-black uppercase border transition-all text-left ${
                                                                                    isActive
                                                                                        ? `${et.color} shadow-sm scale-[0.98]`
                                                                                        : 'bg-slate-50 border-slate-200 text-slate-500 hover:border-slate-300'
                                                                                }`}
                                                                            >
                                                                                {et.label}
                                                                            </button>
                                                                        );
                                                                    })}
                                                                </div>

                                                                {/* Campo fecha si es acuerdo de pago */}
                                                                {merged.etapaGestion === 'acuerdo_pago' && (
                                                                    <div>
                                                                        <p className="text-[8px] font-black text-emerald-600 uppercase mb-1">Fecha del Acuerdo</p>
                                                                        <input
                                                                            type="date"
                                                                            className="w-full bg-emerald-50 border-2 border-emerald-200 rounded-xl px-3 py-2 text-[10px] font-black outline-none focus:border-emerald-500 text-emerald-700"
                                                                            value={merged.fechaAcuerdo || ''}
                                                                            onChange={e => setRecuperoDrafts(prev => ({
                                                                                ...prev,
                                                                                [rec.id]: { ...(prev[rec.id]||{}), fechaAcuerdo: e.target.value }
                                                                            }))}
                                                                        />
                                                                    </div>
                                                                )}

                                                                {/* Alerta acuerdo vencido */}
                                                                {merged._acuerdoVencido && (
                                                                    <div className="flex items-center gap-2 bg-orange-50 border border-orange-200 rounded-xl px-3 py-2">
                                                                        <i data-lucide="alert-triangle" className="w-3 h-3 text-orange-500 shrink-0"></i>
                                                                        <p className="text-[9px] font-black text-orange-600">Acuerdo vencido el {new Date(merged.fechaAcuerdo + 'T00:00:00').toLocaleDateString('es-ES')}</p>
                                                                    </div>
                                                                )}

                                                                {/* Textarea gestion destacada */}
                                                                <div className="relative">
                                                                    <textarea
                                                                        className="w-full bg-amber-50 border-2 border-amber-200 rounded-xl px-3 py-2 text-[10px] font-medium outline-none focus:border-amber-400 resize-none h-16 placeholder:text-amber-400 placeholder:font-bold"
                                                                        placeholder="Escribe la gestion realizada..."
                                                                        value={merged.notaRecupero || ''}
                                                                        onChange={e => setRecuperoDrafts(prev => ({
                                                                            ...prev,
                                                                            [rec.id]: { ...(prev[rec.id]||{}), notaRecupero: e.target.value }
                                                                        }))}
                                                                    />
                                                                </div>

                                                                {/* Boton dinamico segun etapa */}
                                                                <button
                                                                    onClick={() => guardarGestionRecupero(rec)}
                                                                    className={`py-3 text-white rounded-xl text-[9px] font-black uppercase tracking-widest flex items-center justify-center gap-2 transition-all shadow-lg ${
                                                                        merged.etapaGestion === 'recuperado'         ? 'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-100' :
                                                                        merged.etapaGestion === 'perdido_definitivo' ? 'bg-rose-600 hover:bg-rose-500 shadow-rose-100' :
                                                                        merged.etapaGestion === 'acuerdo_pago'       ? 'bg-teal-600 hover:bg-teal-500 shadow-teal-100' :
                                                                        'bg-slate-700 hover:bg-slate-600 shadow-slate-100'
                                                                    }`}
                                                                >
                                                                    <i data-lucide={
                                                                        merged.etapaGestion === 'recuperado'         ? 'check-circle' :
                                                                        merged.etapaGestion === 'perdido_definitivo' ? 'x-circle' :
                                                                        merged.etapaGestion === 'acuerdo_pago'       ? 'handshake' :
                                                                        'save'
                                                                    } className="w-4 h-4"></i>
                                                                    {merged.etapaGestion === 'recuperado'         ? 'Marcar Recuperada' :
                                                                     merged.etapaGestion === 'perdido_definitivo' ? 'Marcar Perdida' :
                                                                     esFinal                                      ? 'Cerrar Gestion' :
                                                                     'Guardar Gestion'}
                                                                </button>
                                                            </div>
                                                        )}

                                                        {/* Resumen si ya cerrada */}
                                                        {rec.recuperada && (
                                                            <div className="xl:text-right min-w-[160px]">
                                                                <p className="text-[8px] font-black text-slate-400 uppercase mb-1">Gestiono</p>
                                                                <p className="text-sm font-black text-slate-700">{merged.asesorRecupero}</p>
                                                                {etapaActual && (
                                                                    <span className={`text-[8px] font-black px-2 py-0.5 rounded-full border ${etapaActual.color} mt-1 inline-block`}>{etapaActual.label}</span>
                                                                )}
                                                                <p className="text-[8px] text-slate-400 mt-1">{merged.notaRecupero}</p>
                                                                {rec.fechaRecupero && <p className="text-[8px] text-slate-300 mt-1">{new Date(rec.fechaRecupero).toLocaleDateString('es-ES')}</p>}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>

                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
