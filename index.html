<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Strategy Hub - David</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #0f172a; overflow-x: hidden; }
        
        .row-critical { background-color: rgba(254, 226, 226, 0.4) !important; border-left: 4px solid #ef4444; }
        .row-alert { background-color: rgba(255, 251, 235, 0.5) !important; border-left: 4px solid #f59e0b; }
        
        .star-manual { fill: #fbbf24 !important; stroke: #d97706 !important; filter: drop-shadow(0 0 3px rgba(251, 191, 36, 0.4)); }
        .star-auto { fill: #3b82f6 !important; stroke: #1d4ed8 !important; opacity: 0.8; }
        .star-empty { fill: #e2e8f0 !important; stroke: #cbd5e1 !important; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .table-container { -webkit-overflow-scrolling: touch; }
        thead th { position: sticky; top: 0; z-index: 10; background: white; }

        .login-card { animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxr8zmUO6jmI4rR5au-Ya08H58XQ9Q18UM-wCijiSYYnSSDb3ZQqUPCJ_vntGarFT1x/exec";
        const MASTER_USER = "Master";

        const App = () => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [gestionados, setGestionados] = useState([]);
            const [filterEstado, setFilterEstado] = useState('Todos');
            const [filterDefinicion, setFilterDefinicion] = useState('Todos');
            const [focoDrafts, setFocoDrafts] = useState({});
            
            // Estado de Autenticación
            const [currentUser, setCurrentUser] = useState(null);

            useEffect(() => { fetchData(); }, []);
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [data, loading, searchTerm, gestionados, filterEstado, currentUser]);

            const fetchData = async () => {
                try {
                    setLoading(true);
                    const response = await fetch(GOOGLE_SCRIPT_URL);
                    const json = await response.json();

                    const normalizeKey = (key) => String(key || "")
                        .normalize("NFD")
                        .replace(/[\u0300-\u036f]/g, "")
                        .replace(/[^a-zA-Z0-9]/g, "")
                        .toLowerCase();

                    const getFieldValue = (obj, candidates) => {
                        if (!obj || typeof obj !== "object") return undefined;

                        for (const key of candidates) {
                            if (Object.prototype.hasOwnProperty.call(obj, key) && obj[key] !== undefined && obj[key] !== null && obj[key] !== "") {
                                return obj[key];
                            }
                        }

                        const normalizedEntries = Object.entries(obj).map(([k, v]) => [normalizeKey(k), v]);
                        const normalizedMap = new Map(normalizedEntries);

                        for (const key of candidates) {
                            const value = normalizedMap.get(normalizeKey(key));
                            if (value !== undefined && value !== null && value !== "") return value;
                        }

                        return undefined;
                    };
                    
                    const normalized = json.map(item => ({
                        ...item,
                        prioridad: String(item.prioridad).toUpperCase() === "TRUE" || item.prioridad === true || item.prioridad === 1,
                        recurrencia: parseFloat(item.recurrencia) || 0,
                        cuentaViva: parseInt(item.cuentaViva) || 0,
                        definicion: String(
    getFieldValue(item, [
        "definicion",
        "Definicion",
        "Definición",
        "DEFINICION",
        "DEFINICIÓN",
        "columnaV",
        "Columna V",
        "V",
        "v",
        "actividad",
        "Actividad",
        "ACTIVIDAD"
    ]) ?? "#N/D"
).trim() || "#N/D"
                    }));
                    setData(normalized);
                } catch (e) { console.error("Error fetching:", e); } finally { setLoading(false); }
            };

            const updateItem = async (updatedItem, isClosing = false) => {
                setSaving(true);
                const finalItem = isClosing ? { ...updatedItem, prioridad: false } : updatedItem;
                if (isClosing) setGestionados(prev => [...prev, finalItem.id]);
                
                setData(prev => prev.map(d => d.id === finalItem.id ? finalItem : d));
                
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify(finalItem)
                    });
                } catch (e) { console.error("Error updating:", e); } finally { 
                    setTimeout(() => setSaving(false), 300); 
                }
            };

            const isPriority = (item) => {
                if (item.prioridad) return "manual";
                const def = item.definicion.toLowerCase();
                if (def.includes("flujo comercial") || def.includes("stock")) return "auto";
                if (item.cuentaViva === 1 && (item.recurrencia === 0 || item.recurrencia === 2)) return "auto";
                if (item.cuentaViva === 1 && item.recurrencia < (item.valorMensual * 0.5)) return "auto";
                return null;
            };

            const getNivel = (item) => {
                if (item.prioridad === true) return "Urgente";
                if (item.cuentaViva === 1 && (item.recurrencia === 0 || item.recurrencia === 2)) return "Critico";
                if (item.cuentaViva === 1 && item.recurrencia < (item.valorMensual * 0.5)) return "Alerta";
                return "Normal";
            };

            const getEstadoTexto = (val) => {
                if (val === 1) return "Vivo";
                if (val === 2) return "Pausa";
                return "Cerrado";
            };

            const propietariosDisponibles = useMemo(() => {
                const unique = [...new Set(data.map(d => d.propietario))].filter(Boolean).sort();
                return [MASTER_USER, ...unique];
            }, [data]);

            // Filtrado por Usuario (Logica Central)
            const userFilteredData = useMemo(() => {
                if (!currentUser || currentUser === MASTER_USER) return data;
                return data.filter(d => d.propietario === currentUser);
            }, [data, currentUser]);

            const definicionesDisponibles = useMemo(() => {
                return [
                    "Todos",
                    "Flujo Cobranzas",
                    "Flujo Comercial",
                    "Stock Cobranzas",
                    "Stock Comercial",
                    "#N/D"
                ];
            }, []);

            const metrics = useMemo(() => {
                const target = userFilteredData.reduce((a, b) => a + (parseFloat(b.valorMensual) || 0), 0);
                const real = userFilteredData.reduce((a, b) => a + (parseFloat(b.recurrencia) || 0), 0);
                const criticos = userFilteredData.filter(d => getNivel(d) === "Critico").length;
                const avance = target > 0 ? (real / target) * 100 : 0;
                return { target, real, criticos, avance };
            }, [userFilteredData]);

            const finalData = useMemo(() => {
                return userFilteredData.filter(d => {
                    const matchSearch = d.nombre.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                      String(d.id).includes(searchTerm);
                    const matchEstado = filterEstado === 'Todos' || getEstadoTexto(d.cuentaViva) === filterEstado;
                    const matchDefinicion = filterDefinicion === 'Todos' || d.definicion === filterDefinicion;
                    return matchSearch && matchEstado && matchDefinicion;
                });
            }, [userFilteredData, searchTerm, filterEstado, filterDefinicion]);

            const focoEstrategico = useMemo(() => {
                return finalData.filter(d => (isPriority(d) !== null || getNivel(d) !== "Normal") && !gestionados.includes(d.id));
            }, [finalData, gestionados]);

            // Pantalla de Selección de Usuario
            if (!currentUser && !loading) return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 p-6">
                    <div className="login-card w-full max-w-md bg-white rounded-[3rem] p-10 shadow-2xl text-center">
                        <div className="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center text-white mx-auto mb-6 shadow-xl">
                            <i data-lucide="shield-check" className="w-8 h-8 text-blue-400"></i>
                        </div>
                        <h2 className="text-2xl font-black text-slate-900 italic tracking-tighter mb-2">Acceso David Elite</h2>
                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-8">Selecciona tu perfil de consultor</p>
                        
                        <div className="space-y-3">
                            {propietariosDisponibles.map(user => (
                                <button 
                                    key={user}
                                    onClick={() => setCurrentUser(user)}
                                    className={`w-full p-5 rounded-2xl text-xs font-black uppercase tracking-widest transition-all flex items-center justify-between group
                                        ${user === MASTER_USER ? 'bg-blue-600 text-white shadow-lg shadow-blue-200' : 'bg-slate-50 text-slate-600 hover:bg-slate-100'}`}
                                >
                                    <span>{user}</span>
                                    <i data-lucide="chevron-right" className={`w-4 h-4 transition-transform group-hover:translate-x-1 ${user === MASTER_USER ? 'text-white' : 'text-slate-300'}`}></i>
                                </button>
                            ))}
                        </div>
                        <p className="mt-8 text-[9px] font-bold text-slate-300 uppercase tracking-widest italic">Retention Intelligence System v2.0</p>
                    </div>
                </div>
            );

            if (loading) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-white">
                    <div className="w-12 h-12 border-4 border-slate-900 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <div className="font-black text-[10px] tracking-[0.3em] uppercase text-slate-400 italic">Sincronizando Sistema David Elite...</div>
                </div>
            );

            return (
                <div className="max-w-[1600px] mx-auto p-4 md:p-8">
                    <header className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 mb-8">
                        <div className="flex items-center gap-6">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-slate-900 shadow-slate-200 rounded-2xl flex items-center justify-center text-white shadow-lg">
                                    <i data-lucide="crown" className="w-6 h-6 text-amber-400"></i>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-extrabold tracking-tighter text-slate-900 italic">David Elite Systems</h1>
                                    <div className="flex items-center gap-2">
                                        <span className="text-[9px] font-black text-blue-600 uppercase tracking-widest">Canal: {currentUser}</span>
                                        <button onClick={() => setCurrentUser(null)} className="text-[8px] font-bold text-slate-400 underline uppercase hover:text-rose-500">Cambiar</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
                            <div className="relative flex-1 lg:w-80">
                                <i data-lucide="search" className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300"></i>
                                <input 
                                    className="w-full pl-12 pr-4 py-4 bg-white border-none rounded-2xl text-xs shadow-sm focus:ring-2 focus:ring-slate-900 outline-none"
                                    placeholder="Buscar por ID o Cliente..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)}
                                />
                            </div>
                            <button onClick={fetchData} className="p-4 bg-white rounded-2xl shadow-sm hover:text-blue-600 transition-colors">
                                <i data-lucide="refresh-cw" className={`w-5 h-5 ${saving ? 'animate-spin' : ''}`}></i>
                            </button>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 md:gap-6 mb-8">
                        <div className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                            <span className="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-2">Mis Carteras</span>
                            <p className="text-3xl font-black text-slate-900">{userFilteredData.length}</p>
                        </div>
                        <div className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                            <span className="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-2">Avance Global</span>
                            <p className="text-3xl font-black text-slate-900">{metrics.avance.toFixed(1)}%</p>
                            <div className="w-full bg-slate-100 h-1.5 rounded-full mt-3 overflow-hidden">
                                <div className="h-full bg-slate-900" style={{width: `${metrics.avance}%`}}></div>
                            </div>
                        </div>
                        <div className="bg-rose-600 p-8 rounded-[2.5rem] shadow-xl shadow-rose-100 text-white relative overflow-hidden">
                            <span className="text-[9px] font-black text-rose-100 uppercase tracking-widest">Riesgos Críticos</span>
                            <p className="text-3xl font-black mt-2">{metrics.criticos}</p>
                            <i data-lucide="alert-triangle" className="absolute -right-2 -bottom-2 w-16 h-16 text-white/10"></i>
                        </div>
                        <div className="bg-slate-900 p-8 rounded-[2.5rem] shadow-xl text-white">
                            <span className="text-[9px] font-black text-slate-500 uppercase tracking-widest block mb-2">Recurrencia Mi Canal</span>
                            <p className="text-3xl font-black text-emerald-400">${metrics.real.toLocaleString()}</p>
                            <p className="text-[8px] font-bold text-slate-500 mt-1 uppercase italic">Meta: ${metrics.target.toLocaleString()}</p>
                        </div>
                    </div>

                    <div className="flex flex-col xl:flex-row gap-8">
                        <div className="w-full xl:w-1/3 order-1 xl:order-2">
                            <div className="bg-slate-900 rounded-[3rem] p-8 text-white shadow-2xl xl:sticky xl:top-8 border border-white/5">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xs font-black tracking-widest flex items-center gap-3 text-blue-400 uppercase italic">
                                        <i data-lucide="zap" className="w-4 h-4"></i> Foco Estratégico
                                    </h3>
                                    <span className="bg-white/10 text-white text-[10px] font-black px-3 py-1 rounded-full">{focoEstrategico.length}</span>
                                </div>

                                <div className="space-y-6 max-h-[600px] overflow-y-auto pr-2 custom-scrollbar">
                                    {focoEstrategico.length > 0 ? (
                                        focoEstrategico.map(p => {
                                            const draft = focoDrafts[p.id] || {};
                                            const focoItem = { ...p, ...draft };
                                            return (
                                            <div key={p.id} className="p-6 rounded-[2.2rem] bg-white/5 border border-white/10 flex flex-col gap-4">
                                                <div className="flex justify-between items-start">
                                                    <div className="flex-1">
                                                        <h4 className="text-[11px] font-black uppercase text-white leading-tight">{p.nombre}</h4>
                                                        <div className="flex flex-wrap items-center gap-2 mt-2">
                                                            <span className="text-[7px] font-black px-1.5 py-0.5 rounded uppercase bg-blue-600/20 text-blue-300 border border-blue-500/30">
                                                                ID: {p.id}
                                                            </span>
                                                            <span className={`text-[7px] font-black uppercase px-1.5 py-0.5 rounded ${getNivel(p) === 'Critico' ? 'bg-rose-600 text-white' : 'text-amber-400 border border-amber-400/30'}`}>
                                                                {getNivel(p)}
                                                            </span>
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="flex items-center justify-end gap-1">
                                                            <span className="text-slate-500 font-bold">$</span>
                                                            <input
                                                                type="number"
                                                                className="w-24 bg-transparent border-b border-white/10 text-right font-black text-[10px] p-1 text-emerald-400 focus:border-blue-400 outline-none"
                                                                value={focoItem.recurrencia}
                                                                onChange={e => {
                                                                    const val = parseFloat(e.target.value) || 0;
                                                                    setFocoDrafts(prev => ({
                                                                        ...prev,
                                                                        [p.id]: { ...(prev[p.id] || {}), recurrencia: val }
                                                                    }));
                                                                }}
                                                            />
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-3 gap-2">
                                                    {[
                                                        {val: 1, label: 'Vivo', color: 'bg-emerald-500'},
                                                        {val: 2, label: 'Pausa', color: 'bg-amber-500'},
                                                        {val: 0, label: 'Cerrado', color: 'bg-slate-500'}
                                                    ].map(opt => (
                                                        <button 
                                                            key={opt.val}
                                                            onClick={() => setFocoDrafts(prev => ({
                                                                ...prev,
                                                                [p.id]: { ...(prev[p.id] || {}), cuentaViva: opt.val }
                                                            }))}
                                                            className={`py-2 rounded-xl text-[8px] font-black uppercase transition-all border ${focoItem.cuentaViva === opt.val ? `${opt.color} border-white/20 text-white` : 'bg-transparent border-white/10 text-slate-500'}`}
                                                        >
                                                            {opt.label}
                                                        </button>
                                                    ))}
                                                </div>

                                                <textarea 
                                                    className="w-full bg-black/40 border border-white/10 rounded-2xl p-3 text-[10px] text-slate-300 outline-none h-16 resize-none placeholder:text-slate-700 font-medium"
                                                    placeholder="Notas de gestión..."
                                                    value={focoItem.actividad || ""}
                                                    onChange={e => setFocoDrafts(prev => ({
                                                        ...prev,
                                                        [p.id]: { ...(prev[p.id] || {}), actividad: e.target.value }
                                                    }))}
                                                ></textarea>

                                                <button 
                                                    onClick={() => {
                                                        const mergedItem = { ...p, ...(focoDrafts[p.id] || {}) };
                                                        updateItem(mergedItem, true);
                                                        setFocoDrafts(prev => {
                                                            const next = { ...prev };
                                                            delete next[p.id];
                                                            return next;
                                                        });
                                                    }}
                                                    className="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest flex items-center justify-center gap-2 shadow-xl transition-all"
                                                >
                                                    <i data-lucide="check-circle" className="w-4 h-4"></i>
                                                    Marcar Gestionado
                                                </button>
                                            </div>
                                            );
                                        })
                                    ) : (
                                        <div className="py-12 text-center">
                                            <p className="text-[10px] font-black text-slate-600 uppercase italic opacity-30">Canal despejado</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="w-full xl:w-2/3 order-2 xl:order-1 bg-white rounded-[3rem] shadow-sm border border-slate-100 overflow-hidden">
                            <div className="p-8 border-b border-slate-50 flex flex-col md:flex-row justify-between items-center bg-slate-50/30 gap-4">
                                <h2 className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Monitor de Auditoría</h2>
                                <div className="flex gap-2 w-full md:w-auto">
                                    <select 
                                        className="bg-white px-4 py-2 rounded-xl text-[9px] font-black uppercase border border-slate-100 outline-none cursor-pointer shadow-sm flex-1"
                                        value={filterEstado} onChange={e => setFilterEstado(e.target.value)}
                                    >
                                        <option value="Todos">Ver Todos</option>
                                        <option value="Vivo">Solo Vivos</option>
                                        <option value="Pausa">En Pausa</option>
                                        <option value="Cerrado">Cerrados</option>
                                    </select>
                                    <select
                                        className="bg-white px-4 py-2 rounded-xl text-[9px] font-black uppercase border border-slate-100 outline-none cursor-pointer shadow-sm flex-1"
                                        value={filterDefinicion}
                                        onChange={e => setFilterDefinicion(e.target.value)}
                                    >
                                        {definicionesDisponibles.map(def => (
                                            <option key={def} value={def}>
                                                {def === "Todos" ? "Definicion: Todas" : def}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                            
                            <div className="overflow-x-auto table-container">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50/50">
                                            <th className="p-6 text-[9px] font-black text-slate-400 uppercase w-16 text-center">Prio</th>
                                            <th className="p-6 text-[9px] font-black text-slate-400 uppercase">Cliente</th>
                                            {currentUser === MASTER_USER && <th className="p-6 text-[9px] font-black text-slate-400 uppercase text-center">Consultor</th>}
                                            <th className="p-6 text-[9px] font-black text-slate-400 uppercase text-center">Definicion</th>
                                            <th className="p-6 text-[9px] font-black text-slate-400 uppercase text-right">Recurrencia</th>
                                            <th className="p-6 text-[9px] font-black text-slate-400 uppercase text-center w-32">Estado</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-50 text-xs">
                                        {finalData.map(item => {
                                            const priorityType = isPriority(item);
                                            const nivel = getNivel(item);
                                            return (
                                                <tr key={item.id} className={`hover:bg-slate-50/50 transition-all ${nivel === 'Critico' ? 'row-critical' : nivel === 'Alerta' ? 'row-alert' : ''}`}>
                                                    <td className="p-6 text-center">
                                                        <button 
                                                            onClick={() => updateItem({...item, prioridad: !item.prioridad})}
                                                            className="transition-transform active:scale-90"
                                                        >
                                                            <i data-lucide="star" className={`w-6 h-6 ${priorityType === 'manual' ? 'star-manual' : priorityType === 'auto' ? 'star-auto' : 'star-empty'}`}></i>
                                                        </button>
                                                    </td>
                                                    <td className="p-6">
                                                        <p className="font-extrabold text-slate-900 text-[11px] leading-tight mb-1">{item.nombre}</p>
                                                        <span className="text-[8px] font-black text-blue-600 uppercase tracking-widest bg-blue-50 px-2 py-0.5 rounded">ID: {item.id}</span>
                                                    </td>
                                                    {currentUser === MASTER_USER && (
                                                        <td className="p-6 text-center">
                                                            <span className="text-[8px] font-black text-slate-400 uppercase">{item.propietario}</span>
                                                        </td>
                                                    )}
                                                    <td className="p-6 text-center">
                                                        <span className="text-[8px] font-black text-slate-500 uppercase">
                                                            {item.definicion || "#N/D"}
                                                        </span>
                                                    </td>
                                                    <td className="p-6 text-right">
                                                        <div className="flex flex-col items-end">
                                                            <div className="flex items-center gap-1">
                                                                <span className="text-slate-300 font-bold">$</span>
                                                                <input 
                                                                    type="number" 
                                                                    className="w-24 bg-transparent border-b border-slate-100 text-right font-black text-xs p-1 focus:border-slate-900 outline-none"
                                                                    value={item.recurrencia}
                                                                    onBlur={e => updateItem({...item, recurrencia: parseFloat(e.target.value) || 0})}
                                                                    onChange={e => {
                                                                        const val = parseFloat(e.target.value) || 0;
                                                                        setData(prev => prev.map(d => d.id === item.id ? {...d, recurrencia: val} : d));
                                                                    }}
                                                                />
                                                            </div>
                                                            <span className="text-[8px] text-slate-400 font-bold mt-1 uppercase italic">Meta: ${item.valorMensual}</span>
                                                        </div>
                                                    </td>
                                                    <td className="p-6">
                                                        <button 
                                                            onClick={() => {
                                                                const next = item.cuentaViva === 1 ? 2 : item.cuentaViva === 2 ? 0 : 1;
                                                                updateItem({...item, cuentaViva: next});
                                                            }}
                                                            className={`w-full py-2 rounded-xl text-[8px] font-black uppercase tracking-widest border transition-all
                                                                ${item.cuentaViva === 1 ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 
                                                                  item.cuentaViva === 2 ? 'bg-amber-50 text-amber-600 border-amber-100' : 
                                                                  'bg-slate-50 text-slate-400 border-slate-200'}`}
                                                        >
                                                            {getEstadoTexto(item.cuentaViva)}
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
